<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareDesk · Appointment Booking Register</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230E7C7B%22/><path d=%22M18 50 L32 50 L40 26 L54 74 L62 40 L70 50 L82 50%22 fill=%22none%22 stroke=%22white%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CAREDESK DESIGN SYSTEM — "Clinic Ledger"
   Same premium clinical-teal + paper foundation as the CXDX
   reference app. Signature motif changed from an ECG pulse to a
   drawn calendar-check (booking / confirmed-visit), since this
   app is about scheduling, not prescription analysis.
   ============================================================ */
:root{
  --ink-900:#0B1F26;
  --ink-800:#122A31;
  --ink-700:#1C3438;
  --teal-700:#0B6665;
  --teal-600:#0E7C7B;
  --teal-500:#14948F;
  --teal-400:#3FB0AB;
  --teal-100:#DCF0EE;
  --teal-50:#EFF8F7;
  --green-600:#178A56;
  --green-500:#1FAA6D;
  --green-100:#DEF3E8;
  --amber-600:#B5620D;
  --amber-500:#DE7F1E;
  --amber-100:#FBEAD4;
  --red-600:#DC2626;
  --red-100:#FDE4E4;
  --violet-600:#6D4AAE;
  --violet-500:#8562C7;
  --violet-100:#EDE7F9;
  --blue-600:#1D5FBF;
  --blue-500:#2E77E0;
  --blue-100:#E1EBFC;
  --paper-50:#F5F8F7;
  --paper-0:#FFFFFF;
  --line-200:#DCE6E4;
  --line-100:#EAF1EF;
  --slate-600:#3F5257;
  --slate-500:#5B7278;
  --slate-400:#7E9297;
  --slate-300:#A7B8BB;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --shadow-sm:0 1px 3px rgba(11,31,38,0.07);
  --shadow-md:0 6px 20px rgba(11,31,38,0.08);
  --shadow-lg:0 16px 40px rgba(11,31,38,0.14);
  --ease:cubic-bezier(.4,0,.2,1);
  --transition:200ms var(--ease);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper-50);
  color:var(--ink-900);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::selection{background:var(--teal-100);color:var(--teal-700);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-200);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-300);}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);}
.u-flex{display:flex;}
.u-between{display:flex;align-items:center;justify-content:space-between;}
.u-gap-8{gap:8px;} .u-gap-12{gap:12px;}
.u-muted{color:var(--slate-500);}
.u-center{display:flex;align-items:center;justify-content:center;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   BRAND MARK — signature motif, reused sparingly.
   A calendar tile draws itself in, then a check tick confirms it —
   read as "date set, booking confirmed" on load.
   ============================================================ */
.brand-logo{display:inline-flex;align-items:center;gap:10px;}
.brand-logo .mark{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(155deg,var(--teal-600),var(--ink-800));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.brand-logo .mark svg{width:24px;height:24px;overflow:visible;}
.brand-logo .mark path{
  fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:120;stroke-dashoffset:120;
  animation:draw-pulse 1.6s var(--ease) 0.2s forwards;
}
@keyframes draw-pulse{to{stroke-dashoffset:0;}}
.brand-logo .wordmark{
  font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.5px;
  background:linear-gradient(100deg,var(--ink-900) 30%,var(--teal-600) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-logo.on-dark .wordmark{
  background:linear-gradient(100deg,#fff 30%,var(--teal-400) 75%);
  -webkit-background-clip:text;background-clip:text;
}

/* traveling highlight dot orbiting a soft arc, used on login hero — replaces the old ECG trace
   with motion that reads as "always scheduling / always on". */
.brand-trace{position:relative;width:100%;max-width:360px;height:34px;margin:0 auto;}
.brand-trace svg{width:100%;height:100%;overflow:visible;}
.brand-trace path{
  fill:none;stroke:var(--teal-500);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:6 460;stroke-dashoffset:0;
  animation:trace-run 3.2s linear infinite;
  opacity:0.85;
}
.brand-trace path.ghost{stroke:var(--line-200);stroke-dasharray:none;opacity:1;animation:none;stroke-width:1.5;}
@keyframes trace-run{
  0%{stroke-dasharray:6 460;stroke-dashoffset:0;}
  85%{stroke-dasharray:6 460;stroke-dashoffset:-460;}
  100%{stroke-dasharray:6 460;stroke-dashoffset:-466;}
}

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;background:var(--paper-50);
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(600px 300px at 15% 0%, var(--teal-100) 0%, transparent 60%),
    radial-gradient(500px 260px at 100% 100%, var(--amber-100) 0%, transparent 55%);
  opacity:0.7;pointer-events:none;
}
.login-hero{position:relative;text-align:center;margin-bottom:28px;animation:rise-in 0.7s var(--ease) both;}
.login-hero .brand-logo{justify-content:center;transform:scale(1.15);margin-bottom:10px;}
.login-hero h1{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--slate-500);letter-spacing:0.2px;margin-top:6px;}
.login-card{
  position:relative;width:100%;max-width:388px;background:var(--paper-0);
  border:1px solid var(--line-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:32px 30px 28px;animation:rise-in 0.7s var(--ease) 0.1s both;
}
@keyframes rise-in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.login-card .field{margin-bottom:16px;}
.login-card label{display:block;font-size:12.5px;font-weight:600;color:var(--slate-600);margin-bottom:6px;letter-spacing:0.15px;}
.login-card input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line-200);border-radius:var(--radius-sm);
  background:var(--paper-50);transition:border-color var(--transition),background var(--transition);
}
.login-card input:focus{outline:none;border-color:var(--teal-500);background:var(--paper-0);}
#login-error{
  display:none;background:var(--red-100);color:var(--red-600);font-size:13px;font-weight:500;
  padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;
}
.login-foot{text-align:center;margin-top:22px;}
.login-foot .brand-trace{opacity:0.8;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;border-radius:var(--radius-sm);border:1.5px solid transparent;
  padding:10px 18px;transition:transform 120ms var(--ease),box-shadow var(--transition),background var(--transition),border-color var(--transition),opacity var(--transition);
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-block{width:100%;}
.btn-primary{background:linear-gradient(120deg,var(--teal-600),var(--teal-700));color:#fff;box-shadow:0 2px 10px rgba(14,124,123,0.28);}
.btn-primary:hover{box-shadow:0 4px 16px rgba(14,124,123,0.36);}
.btn-secondary{background:var(--paper-0);color:var(--ink-900);border-color:var(--line-200);}
.btn-secondary:hover{border-color:var(--teal-400);color:var(--teal-700);}
.btn-ghost{background:transparent;color:var(--slate-600);}
.btn-ghost:hover{background:var(--line-100);}
.btn-danger{background:var(--paper-0);color:var(--red-600);border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
.btn-danger-solid{background:var(--red-600);color:#fff;}
.btn-danger-solid:hover{background:#c41f1f;}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1.5px solid transparent;color:var(--slate-500);transition:all var(--transition);
}
.icon-btn:hover{background:var(--line-100);color:var(--ink-900);}
.icon-btn.danger:hover{background:var(--red-100);color:var(--red-600);}
.icon-btn svg{width:17px;height:17px;}

/* ============================================================
   APP SHELL
   ============================================================ */
#app-shell{display:flex;min-height:100vh;}
#sidebar{
  width:242px;flex-shrink:0;background:var(--ink-900);color:#fff;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform var(--transition);
}
#sidebar .side-head{padding:22px 20px 16px;}
#sidebar .brand-logo{transform:scale(0.92);transform-origin:left center;}
.clinic-chip{
  margin:2px 20px 14px;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;font-size:12px;color:var(--teal-400);display:flex;align-items:center;gap:7px;
}
.clinic-chip svg{width:14px;height:14px;flex-shrink:0;}
.clinic-chip b{color:#fff;font-weight:600;display:block;font-size:12.5px;}
nav.side-nav{flex:1;padding:6px 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;margin-bottom:2px;
  color:rgba(255,255,255,0.62);font-size:13.5px;font-weight:500;position:relative;cursor:pointer;
  transition:background var(--transition),color var(--transition);
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(20,148,143,0.22);color:#fff;}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;
  background:var(--teal-400);border-radius:0 3px 3px 0;
}
#sidebar .side-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--teal-500),var(--teal-700));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;
}
.user-chip .who{overflow:hidden;}
.user-chip .who .nm{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .who .rl{font-size:11px;color:rgba(255,255,255,0.45);text-transform:capitalize;}
.sidebar-trace{height:26px;margin-top:6px;opacity:0.5;}
.sidebar-trace svg{width:100%;height:100%;}
.sidebar-trace path{fill:none;stroke:var(--teal-400);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 300;animation:trace-run 4s linear infinite;}

#main-col{margin-left:242px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
#topbar{
  height:64px;flex-shrink:0;background:var(--paper-0);border-bottom:1px solid var(--line-200);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30;
}
#topbar .crumb{font-family:var(--font-display);font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:10px;}
#topbar .crumb .sub{font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--slate-400);}
#menu-toggle{display:none;}
#content{flex:1;padding:26px;max-width:1360px;width:100%;}
.view{animation:fade-up 0.35s var(--ease) both;}
@keyframes fade-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   CARDS / STATS
   ============================================================ */
.card{background:var(--paper-0);border:1px solid var(--line-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:22px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-100);}
.card-head h3{font-family:var(--font-display);font-size:15px;font-weight:600;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.clinic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,330px));gap:14px;margin-bottom:22px;}
.dash-chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px;}
.report-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;}
.stat-card{
  background:var(--paper-0);border:1px solid var(--line-200);border-radius:var(--radius-md);padding:18px 20px;
  transition:transform var(--transition),box-shadow var(--transition);position:relative;overflow:hidden;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card .lbl{font-size:11.5px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;}
.stat-card .val{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;color:var(--ink-900);}
.stat-card .delta{font-size:12px;margin-top:5px;font-weight:600;}
.stat-card.accent-teal{border-top:3px solid var(--teal-500);}
.stat-card.accent-green{border-top:3px solid var(--green-500);}
.stat-card.accent-amber{border-top:3px solid var(--amber-500);}
.stat-card.accent-ink{border-top:3px solid var(--ink-700);}
.stat-card.accent-violet{border-top:3px solid var(--violet-500);}
.stat-card.accent-blue{border-top:3px solid var(--blue-500);}
.stat-card.accent-red{border-top:3px solid var(--red-600);}
.stat-card .val.c-green{color:var(--green-600);}

/* ---------- Dashboard stat icon badges (colorful, animated) ---------- */
.stat-icon-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:6px;flex-shrink:0;
  animation:statBadgePulse 2.6s ease-in-out infinite;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.stat-icon-badge svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;}
.stat-card:hover .stat-icon-badge{transform:scale(1.14) translateY(-1px);animation-play-state:paused;box-shadow:0 5px 12px 0 var(--glow);}
.stat-icon-badge.badge-ink{background:linear-gradient(135deg,var(--ink-700),var(--ink-900));--glow:rgba(11,31,38,.5);}
.stat-icon-badge.badge-teal{background:linear-gradient(135deg,var(--teal-400),var(--teal-700));--glow:rgba(14,148,143,.5);}
.stat-icon-badge.badge-green{background:linear-gradient(135deg,#42D68C,var(--green-600));--glow:rgba(23,138,86,.5);}
.stat-icon-badge.badge-amber{background:linear-gradient(135deg,#F7AC4D,var(--amber-600));--glow:rgba(181,98,13,.5);}
.stat-icon-badge.badge-violet{background:linear-gradient(135deg,#A98AE0,var(--violet-600));--glow:rgba(109,74,174,.5);}
.stat-icon-badge.badge-blue{background:linear-gradient(135deg,#6FA3EE,var(--blue-600));--glow:rgba(29,95,191,.5);}
.stat-icon-badge.badge-red{background:linear-gradient(135deg,#F0716B,var(--red-600));--glow:rgba(220,38,38,.5);}
@keyframes statBadgePulse{
  0%,100%{box-shadow:0 2px 5px -1px var(--glow);}
  50%{box-shadow:0 3px 10px 0 var(--glow);}
}
@media (prefers-reduced-motion: reduce){.stat-icon-badge{animation:none;}}

/* ============================================================
   FORMS
   ============================================================ */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.field-wrap{display:flex;flex-direction:column;gap:6px;}
.hint{font-size:11.5px;color:var(--slate-400);}
.field-wrap.span-2{grid-column:span 2;}
.field-wrap label{font-size:12.5px;font-weight:600;color:var(--slate-600);}
.field-wrap label .req{color:var(--amber-600);}
.field-wrap .hint{font-size:11px;color:var(--slate-400);}
.field-wrap .err{font-size:11.5px;color:var(--red-600);display:none;font-weight:500;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line-200);border-radius:var(--radius-sm);
  background:var(--paper-0);color:var(--ink-900);transition:border-color var(--transition);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-500);}
input.invalid,select.invalid{border-color:var(--red-600);}
select{appearance:none;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235B7278' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;}

.search-select{position:relative;}
.search-select .ss-input{cursor:text;}
.search-select .ss-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--paper-0);border:1.5px solid var(--line-200);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-md);max-height:230px;overflow-y:auto;z-index:60;
}
.search-select .ss-option{padding:9px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-900);}
.search-select .ss-option:hover,.search-select .ss-option.active{background:var(--teal-50);}
.search-select .ss-empty{padding:9px 12px;font-size:13px;color:var(--slate-400);}
textarea{resize:vertical;min-height:64px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate-600);}

.multi-row{
  display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;margin-bottom:10px;
  padding:12px 14px 12px 40px;background:var(--paper-50);border-radius:var(--radius-sm);border:1px solid var(--line-100);position:relative;
}
.multi-row .row-num{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  background:var(--teal-100);color:var(--teal-700);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
#add-multi-row-btn{margin-top:2px;}

.form-page{max-width:760px;margin:0 auto;}
.summary-pill{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--teal-700);
  background:var(--teal-50);border:1px solid var(--teal-100);padding:5px 12px;border-radius:99px;
  white-space:nowrap;flex-shrink:0;
}
.form-section-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--teal-100);color:var(--teal-700);margin-right:8px;}
.form-section-icon svg{width:14px;height:14px;}

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--line-200);background:var(--paper-0);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{
  text-align:left;padding:12px 16px;background:var(--paper-50);color:var(--slate-600);font-weight:600;
  font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--line-200);white-space:nowrap;
  position:sticky;top:0;
}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line-100);white-space:nowrap;color:var(--ink-900);}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background var(--transition);}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function formatInt(n) { return (n || 0).toLocaleString('en-IN'); }
function debounce(fn, wait) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}
function pad2(n) { return String(n).padStart(2, '0'); }
// Parses the leading "HH:MM AM/PM" off a "HH:MM AM/PM – HH:MM AM/PM" time-slot string into
// minutes-since-midnight, for chronological sorting. A plain string/localeCompare sort gets
// the noon/1pm boundary wrong — "01:00 PM" < "12:00 PM" as text even though 1pm is later.
function timeSlotSortKey(timeSlotStr) {
  if (!timeSlotStr) return 0;
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(String(timeSlotStr).trim());
  if (!m) return 0;
  let h = parseInt(m[1], 10);
  const mins = parseInt(m[2], 10);
  const ap = m[3].toUpperCase();
  if (ap === 'PM' && h !== 12) h += 12;
  if (ap === 'AM' && h === 12) h = 0;
  return h * 60 + mins;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function formatDateHuman(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateTimeHuman(input) {
  let d;
  if (!input) return '—';
  if (typeof input.toDate === 'function') d = input.toDate();
  else d = new Date(input);
  if (isNaN(d)) return '—';
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
}
function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v || '').trim()); }
function validateMobile(v) {
  const digits = (v || '').replace(/[^\d]/g, '');
  return digits.length >= 7 && digits.length <= 15;
}
function normalizeMobile(v) { return (v || '').replace(/[^\d+]/g, ''); }
function initialsOf(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

/* ---------- Modal ---------- */
function openModal(html, opts) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" data-close="1"></div><div class="modal-box${opts && opts.wide ? ' wide' : ''}">${html}</div>`;
  root.classList.add('show');
  root.querySelector('.modal-backdrop').addEventListener('mousedown', () => { if (!(opts && opts.persistent)) closeModal(); });
  document.addEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const root = document.getElementById('modal-root');
  root.classList.remove('show');
  root.innerHTML = '';
  document.removeEventListener('keydown', modalEscHandler);
}
function confirmDialog({ title, message, confirmLabel, danger, extra }) {
  return new Promise((resolve) => {
    openModal(`
      <div class="modal-head"><h3>${escapeHtml(title || 'Are you sure?')}</h3><button class="icon-btn" id="cd-x">${icon('x')}</button></div>
      <div class="modal-body"><p style="font-size:13.5px;color:var(--slate-600);line-height:1.55;">${message || ''}</p>${extra || ''}</div>
      <div class="modal-foot"><button class="btn btn-secondary" id="cd-cancel">Cancel</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" id="cd-ok">${escapeHtml(confirmLabel || 'Confirm')}</button></div>
    `, { persistent: true });
    const finish = (v) => { closeModal(); resolve(v); };
    document.getElementById('cd-x').addEventListener('click', () => finish(false));
    document.getElementById('cd-cancel').addEventListener('click', () => finish(false));
    document.getElementById('cd-ok').addEventListener('click', () => finish(true));
  });
}

/* ---------- Animated count-up for stat cards ---------- */
function animateCountUp(el, end) {
  if (!el) return;
  const start = 0, dur = 700, t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatInt(Math.round(start + (end - start) * eased));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------- Search-select (typeahead) component ---------- */
function initSearchSelect(id, options, initialValue, onSelect, blankLabel, freeText) {
  const root = document.getElementById(id);
  if (!root) return null;
  let opts = options.slice();
  if (initialValue && !opts.some(o => o.value === initialValue)) opts = [{ value: initialValue, label: initialValue + ' (custom)' }].concat(opts);
  let value = initialValue || '';
  function labelFor(v) { if (blankLabel !== undefined && v === blankLabel) return ''; const o = opts.find(x => x.value === v); return o ? o.label : (freeText ? v : ''); }
  root.innerHTML = `<input type="text" class="ss-input" autocomplete="off" placeholder="${blankLabel !== undefined ? escapeHtml(blankLabel) : 'Type to search…'}" value="${escapeHtml(labelFor(value))}"><div class="ss-dropdown hidden"></div>${freeText ? '<div class="hint" style="margin-top:4px;">Pick from the list, or type your own.</div>' : ''}`;
  const input = root.querySelector('.ss-input'), dropdown = root.querySelector('.ss-dropdown');
  let activeIndex = -1, visible = [];
  function renderList(term) {
    const t = (term || '').trim().toLowerCase();
    visible = t ? opts.filter(o => o.label.toLowerCase().includes(t)) : opts;
    activeIndex = -1;
    dropdown.innerHTML = visible.length ? visible.slice(0, 60).map((o, i) => `<div class="ss-option" data-i="${i}">${escapeHtml(o.label)}</div>`).join('') : `<div class="ss-empty">${freeText ? 'No matches — your typed text will be used' : 'No matches'}</div>`;
    dropdown.classList.remove('hidden');
    dropdown.querySelectorAll('.ss-option').forEach(el => el.addEventListener('mousedown', (e) => { e.preventDefault(); choose(visible[+el.dataset.i]); }));
  }
  function choose(opt) {
    value = opt ? opt.value : (blankLabel !== undefined ? blankLabel : '');
    input.value = labelFor(value);
    dropdown.classList.add('hidden');
    if (onSelect) onSelect(value, opt);
  }
  function highlight(i) {
    activeIndex = i;
    dropdown.querySelectorAll('.ss-option').forEach((el, idx) => el.classList.toggle('active', idx === i));
    const el = dropdown.querySelector(`.ss-option[data-i="${i}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('focus', () => renderList(''));
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', (e) => {
    if (dropdown.classList.contains('hidden') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { renderList(input.value); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight(Math.min(activeIndex + 1, visible.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(Math.max(activeIndex - 1, 0)); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && visible[activeIndex]) { e.stopPropagation(); choose(visible[activeIndex]); }
      else if (freeText && input.value.trim()) { e.stopPropagation(); value = input.value.trim(); dropdown.classList.add('hidden'); if (onSelect) onSelect(value, null); }
    }
    else if (e.key === 'Escape') { dropdown.classList.add('hidden'); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      dropdown.classList.add('hidden');
      const typed = input.value.trim();
      if (freeText && typed && !opts.some(o => o.label === typed)) { value = typed; if (onSelect) onSelect(value, null); }
      else { input.value = labelFor(value); }
    }, 150);
  });
  return {
    getValue: () => value,
    setOptions: (newOptions, newValue) => {
      opts = newOptions.slice();
      if (newValue !== undefined) value = newValue;
      if (value && !opts.some(o => o.value === value)) opts = [{ value, label: value + ' (custom)' }].concat(opts);
      input.value = labelFor(value);
    }
  };
}

/* ---------- Time-slot generation from settings ---------- */
function generateTimeSlots(registerKey) {
  const s = state.settings || DEFAULT_SETTINGS;
  const mins = (s.slotMinutes && s.slotMinutes[registerKey]) || DEFAULT_SETTINGS.slotMinutes[registerKey] || 15;
  const [sh, sm] = (s.clinicStart || '09:00').split(':').map(Number);
  const [eh, em] = (s.clinicEnd || '20:00').split(':').map(Number);
  let cur = sh * 60 + sm;
  const end = eh * 60 + em;
  const slots = [];
  function fmt(mTotal) {
    let h = Math.floor(mTotal / 60), m = mTotal % 60;
    const ap = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${pad2(h12)}:${pad2(m)} ${ap}`;
  }
  while (cur + mins <= end) {
    slots.push(`${fmt(cur)} – ${fmt(cur + mins)}`);
    cur += mins;
  }
  return slots;
}

/* ---------- Simple select-options renderer ---------- */
function optionsHtml(list, current, opts) {
  opts = opts || {};
  let out = opts.blank ? `<option value="">${escapeHtml(opts.blank)}</option>` : '';
  out += list.map(v => `<option value="${escapeHtml(v)}" ${v === current ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return out;
}

async function loadClinicContext(clinicId) {
  const clinicSnap = await getDoc(doc(db, 'clinics', clinicId));
  if (!clinicSnap.exists()) throw new Error('Clinic not found.');
  const b = clinicSnap.data();
  state.clinicId = clinicId;
  state.clinicName = b.name || 'Clinic';
  state.clinicActive = b.active !== false;
  state.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings || {}, {
    slotMinutes: Object.assign({}, DEFAULT_SETTINGS.slotMinutes, (b.settings && b.settings.slotMinutes) || {}),
    bookingSources: (b.settings && b.settings.bookingSources && b.settings.bookingSources.length) ? b.settings.bookingSources : DEFAULT_SETTINGS.bookingSources.slice(),
    dentalTreatmentTypes: (b.settings && b.settings.dentalTreatmentTypes && b.settings.dentalTreatmentTypes.length) ? b.settings.dentalTreatmentTypes : DEFAULT_SETTINGS.dentalTreatmentTypes.slice()
  });
  const [docSnap, testSnap] = await Promise.all([
    getDocs(collection(db, 'clinics', clinicId, 'doctors')),
    getDocs(collection(db, 'clinics', clinicId, 'tests'))
  ]);
  state.doctors = docSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b2) => (a.name || '').localeCompare(b2.name || ''));
  state.tests = testSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b2) => (a.name || '').localeCompare(b2.name || ''));
}
function exitClinic() {
  state.clinicId = null; state.clinicName = ''; state.doctors = []; state.tests = []; state.settings = null;
  renderShellChrome();
  navigateTo('sa-clinics');
}

async function loadUserProfileAndBegin(fbUser) {
  try {
    const snap = await getDoc(doc(db, 'users', fbUser.uid));
    if (!snap.exists()) { await signOut(auth); showLoginScreen('No profile found for this account. Contact your administrator.'); return; }
    const u = snap.data();
    if (u.deleted) { await signOut(auth); showLoginScreen('This account has been removed.'); return; }
    // Normalize role so a manually-typed Firestore value like "Super Admin" or "Admin "
    // still matches — the exact lowercase value (superadmin/admin/agent) is still what's
    // required in firestore.rules, so this is a friendliness net for the app, not a
    // replacement for fixing the stored value.
    const normalizedRole = String(u.role || '').trim().toLowerCase().replace(/\s+/g, '');
    state.user = { uid: fbUser.uid, email: fbUser.email, name: u.name || fbUser.email, role: normalizedRole, clinicId: u.clinicId || null, permissions: u.permissions || {}, visibilityDays: u.visibilityDays || null };
    state.isSuperAdmin = normalizedRole === ROLES.SUPERADMIN;
    state.isAdmin = normalizedRole === ROLES.ADMIN;
    state.isAgent = normalizedRole === ROLES.AGENT;

    if (!state.isSuperAdmin && !state.isAdmin && !state.isAgent) {
      await signOut(auth);
      showLoginScreen(`Unrecognized role "${u.role}" on this account. Ask a super admin to set it to exactly superadmin, admin, or agent in Firestore.`);
      return;
    }

    if (state.isSuperAdmin) {
      // Super admin starts at the clinics list; clinic context is loaded only after they enter one.
      showAppShell();
      renderShellChrome();
      navigateTo('sa-clinics');
    } else {
      if (!u.clinicId) { await signOut(auth); showLoginScreen('Your account is not linked to a clinic. Contact your administrator.'); return; }
      await loadClinicContext(u.clinicId);
      if (!state.clinicActive) { await signOut(auth); showLoginScreen('Your clinic has been deactivated. Contact your administrator.'); return; }
      showAppShell();
      renderShellChrome();
      navigateTo('dashboard');
    }
  } catch (err) {
    console.error(err);
    await signOut(auth).catch(() => {});
    showLoginScreen('Something went wrong loading your account. Please try again.');
  }
}

function wireAuthListeners() {
  onAuthStateChanged(auth, (fbUser) => {
    if (fbUser) loadUserProfileAndBegin(fbUser);
    else showLoginScreen();
  });
  document.getElementById('login-card').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-password').value;
    const btn = document.getElementById('login-submit-btn');
    setBtnLoading(btn, true, 'Signing in…');
    try {
      await signInWithEmailAndPassword(auth, email, pw);
    } catch (err) {
      setBtnLoading(btn, false);
      const msg = (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found')
        ? 'Incorrect email or password.' : (err.message || 'Sign-in failed.');
      showLoginScreen(msg);
    }
  });
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    state.user = null; state.clinicId = null; state.clinicName = ''; state.registerCache = {}; state.agentsCache = null; state.agentsCacheClinicId = null;
  });
  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-scrim').classList.toggle('show');
  });
  document.getElementById('sidebar-scrim').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-scrim').classList.remove('show');
  });
}

const NAV_ITEMS_SUPERADMIN_TOP = [
  { view: 'sa-clinics', label: 'Clinics', icon: 'building2' }
];
const NAV_ITEMS_ADMIN = [
  { view: 'dashboard', label: 'Dashboard', icon: 'grid' },
  { view: 'doctor', label: REGISTERS.doctor.label, icon: REGISTERS.doctor.icon },
  { view: 'test', label: REGISTERS.test.label, icon: REGISTERS.test.icon },
  { view: 'homeCollection', label: REGISTERS.homeCollection.label, icon: REGISTERS.homeCollection.icon },

  { view: 'users', label: 'User Management', icon: 'users' },
  { view: 'reports', label: 'Reports', icon: 'barChart' },
  { view: 'settings', label: 'Settings', icon: 'settings' }
];
function navItemsForAgent() {
  const perms = (state.user && state.user.permissions) || {};
  const items = [{ view: 'dashboard', label: 'Dashboard', icon: 'grid' }];
  REGISTER_KEYS.forEach(k => { if (perms[k]) items.push({ view: k, label: REGISTERS[k].label, icon: REGISTERS[k].icon }); });
  return items;
}
function currentNavItems() {
  if (state.isSuperAdmin && !state.clinicId) return NAV_ITEMS_SUPERADMIN_TOP;
  if (state.isAgent) return navItemsForAgent();
  return NAV_ITEMS_ADMIN;
}
function renderSideNav() {
  const items = currentNavItems();
  const nav = document.getElementById('side-nav');
  nav.innerHTML = items.map(it => `<div class="nav-item ${state.view === it.view ? 'active' : ''}" data-nav="${it.view}">${icon(it.icon)}<span>${escapeHtml(it.label)}</span></div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => navigateTo(el.dataset.nav)));
}
function renderClinicChip() {
  const slot = document.getElementById('clinic-chip-slot');
  if (state.isSuperAdmin && !state.clinicId) { slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="clinic-chip">${icon('building2')}<div><b>${escapeHtml(state.clinicName)}</b>${state.isSuperAdmin ? '<span style="opacity:.75;">Super Admin view</span>' : ''}</div></div>
    ${state.isSuperAdmin ? `<div style="margin:-8px 20px 14px;"><button class="btn btn-ghost btn-sm" id="exit-clinic-btn" style="color:var(--teal-400);">${icon('arrowLeft')}All Clinics</button></div>` : ''}
  `;
  const exitBtn = document.getElementById('exit-clinic-btn');
  if (exitBtn) exitBtn.addEventListener('click', exitClinic);
}
function renderShellChrome() {
  renderSideNav();
  renderClinicChip();
  document.getElementById('user-avatar').textContent = initialsOf(state.user.name);
  document.getElementById('user-name').textContent = state.user.name;
  document.getElementById('user-role').textContent = state.user.role;
}
function renderTopbarCrumb() {
  const t = VIEW_TITLES[state.view] || [state.view, ''];
  const title = REGISTERS[state.view] ? REGISTERS[state.view].label : t[0];
  document.getElementById('crumb-title').textContent = title;
  document.getElementById('crumb-sub').textContent = t[1] || '';
  document.getElementById('topbar-actions').innerHTML = '';
}
async function renderView(view, params) {
  params = params || {};
  const content = document.getElementById('content');
  content.innerHTML = `<div class="u-center" style="padding:90px 0;"><span class="loader-ring"></span></div>`;
  try {
    if (view === 'dashboard') await renderDashboardView(content);
    else if (view === 'sa-clinics') await renderClinicsListView(content);
    else if (REGISTERS[view]) await renderRegisterListView(content, view);
    else if (view === 'masters') await renderMastersView(content);
    else if (view === 'users') await renderUserManagementView(content, params.forceRefresh);
    else if (view === 'reports') await renderReportsView(content);
    else if (view === 'settings') await renderSettingsView(content);
    else if (view === 'register-form') await renderRegisterFormView(content, params.registerKey, params.id);
    else if (view === 'recycle-bin') await renderRecycleBinView(content, params.kind);
    else content.innerHTML = `<div class="empty-state"><h4>Not found</h4></div>`;
  } catch (err) {
    console.error(err);
    content.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Something went wrong</h4><p>${escapeHtml(err.message || 'Please try again.')}</p></div>`;
  }
}
function navigateTo(view, params) {
  state.view = view;
  state.viewParams = params || {};
  renderSideNav();
  renderTopbarCrumb();
  renderView(view, state.viewParams);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-scrim').classList.remove('show');
  window.scrollTo(0, 0);
}

async function renderClinicsListView(content) {
  const snap = await getDocs(query(collection(db, 'clinics'), orderBy('name')));
  const clinics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  content.innerHTML = `
    <div class="u-between" style="margin-bottom:18px;flex-wrap:wrap;gap:12px;">
      <p class="u-muted" style="font-size:13.5px;max-width:520px;">Each clinic has its own doctors, tests, bookings and staff. Enter a clinic to manage its registers, or use Manage to configure staff and bulk-delete tools.</p>
      <button class="btn btn-primary" id="new-clinic-btn">${icon('plus')}New Clinic</button>
    </div>
    ${clinics.length ? `<div class="clinic-grid">${clinics.map(b => clinicCardHtml(b)).join('')}</div>` : `
      <div class="empty-state">${icon('building2')}<h4>No clinics yet</h4><p>Create your first clinic to start taking bookings.</p></div>
    `}
  `;
  document.getElementById('new-clinic-btn').addEventListener('click', openCreateClinicModal);
  content.querySelectorAll('[data-enter]').forEach(el => el.addEventListener('click', () => enterClinic(el.dataset.enter)));
  content.querySelectorAll('[data-manage]').forEach(el => el.addEventListener('click', () => openManageClinicModal(el.dataset.manage)));
}
function clinicCardHtml(b) {
  return `
    <div class="stat-card accent-${b.active === false ? 'amber' : 'teal'}">
      <div class="u-between">
        <span class="lbl">${icon('building2')}${escapeHtml(b.name)}</span>
        <span class="badge ${b.active === false ? 'inactive' : 'active'}">${b.active === false ? 'Inactive' : 'Active'}</span>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" data-enter="${b.id}" style="flex:1;">${icon('chevronRight')}Enter</button>
        <button class="btn btn-ghost btn-sm" data-manage="${b.id}">${icon('settings')}Manage</button>
      </div>
    </div>
  `;
}

  } catch (err) { toast(err.message || 'Could not open clinic.', 'error'); }
}
function openCreateClinicModal() {
  openModal(`
    <div class="modal-head"><h3>New Clinic</h3><button class="icon-btn" id="m-x">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="field-wrap" style="margin-bottom:16px;"><label>Clinic Name <span class="req">*</span></label><input type="text" id="nb-name" placeholder="e.g. Salt Lake Diagnostic Center"></div>
      <div class="divider"></div>
      <span class="section-label">First admin account (optional — add later if you prefer)</span>
      <div class="form-grid">
        <div class="field-wrap"><label>Admin Name</label><input type="text" id="nb-admin-name" placeholder="Full name"></div>
        <div class="field-wrap"><label>Admin Email</label><input type="email" id="nb-admin-email" placeholder="admin@clinic.com"></div>
        <div class="field-wrap span-2"><label>Password</label><input type="text" id="nb-admin-pass" placeholder="Min 6 characters"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="m-cancel">Cancel</button><button class="btn btn-primary" id="nb-save">${icon('plus')}Create Clinic</button></div>
  `);
  document.getElementById('m-x').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('nb-save').addEventListener('click', async () => {
    const name = document.getElementById('nb-name').value.trim();
    const aName = document.getElementById('nb-admin-name').value.trim();
    const aEmail = document.getElementById('nb-admin-email').value.trim();
    const aPass = document.getElementById('nb-admin-pass').value;
    if (!name) { toast('Clinic name is required.', 'error'); return; }
    if ((aName || aEmail || aPass) && (!aName || !aEmail || !aPass)) { toast('Fill in all three admin fields, or leave all three blank.', 'error'); return; }
    if (aEmail && !validateEmail(aEmail)) { toast('Admin email looks invalid.', 'error'); return; }
    if (aPass && aPass.length < 6) { toast('Password must be at least 6 characters.', 'error'); return; }

    setBtnLoading(btn, true, 'Creating…');
    try {
      const ref = await addDoc(collection(db, 'clinics'), { name, active: true, createdAt: serverTimestamp(), createdBy: state.user.uid, settings: {} });
      if (aEmail) await createStaffAccount({ name: aName, email: aEmail, password: aPass, role: ROLES.ADMIN, clinicId: ref.id, permissions: {} });

  const b = { id: clinicId, ...snap.data() };

  document.getElementById('m-cancel').addEventListener('click', closeModal);

async function bulkDeleteRegisterByDateRange(clinicId, registerKey, fromISO, toISO) {
  const colRef = collection(db, 'clinics', clinicId, REGISTERS[registerKey].collection);
  const snap = await getDocs(query(colRef, where('appointmentDate', '>=', fromISO), where('appointmentDate', '<=', toISO)));
  if (snap.empty) return 0;
  const docs = snap.docs;

  // Tally net summary deltas across every doc being removed (skip ones already soft-deleted —
  // those were already decremented from the summary when they were sent to the recycle bin).
  // A batch can only write a given document once, so deltas from many bookings sharing the same
  // summary doc must be pre-aggregated here rather than staged per-booking like the single-record
  // CRUD functions do.
  const dsDelta = {}, monthDelta = {};
  docs.forEach((d) => {
    const row = d.data();
    if (row.deleted) return;
    const s = row.status || 'Booked';
    dsDelta[`${registerKey}_total`] = (dsDelta[`${registerKey}_total`] || 0) - 1;
    dsDelta[`${registerKey}_${s}`] = (dsDelta[`${registerKey}_${s}`] || 0) - 1;
    if (row.appointmentDate) {
      const mk = row.appointmentDate.slice(0, 7);
      if (!monthDelta[mk]) monthDelta[mk] = {};
      monthDelta[mk].total = (monthDelta[mk].total || 0) - 1;
      monthDelta[mk][s] = (monthDelta[mk][s] || 0) - 1;
    }
  });

  for (let i = 0; i < docs.length; i += 450) {
    const batch = writeBatch(db);
    docs.slice(i, i + 450).forEach(d => batch.delete(d.ref));
    if (i === 0) {
      const dsPatch = {};
      Object.keys(dsDelta).forEach(k => { if (dsDelta[k]) dsPatch[k] = increment(dsDelta[k]); });
      if (Object.keys(dsPatch).length) { dsPatch.updatedAt = serverTimestamp(); batch.set(doc(db, 'clinics', clinicId, 'meta', 'dashboardSummary'), dsPatch, { merge: true }); }
      Object.keys(monthDelta).forEach((mk) => {
        const d = monthDelta[mk], patch = { registerKey, monthKey: mk, updatedAt: serverTimestamp() };
        let has = false;
        Object.keys(d).forEach(k => { if (d[k]) { patch[k] = increment(d[k]); has = true; } });
        if (has) batch.set(doc(db, 'clinics', clinicId, 'monthlySummaries', `${registerKey}_${mk}`), patch, { merge: true });
      });
    }
    await batch.commit();
  }
  return docs.length;
}
async function deleteAllInSubcollection(clinicId, subName) {

async function deleteClinicCascade(clinicId) {
  const subs = ['doctors', 'tests', 'counters', 'monthlySummaries', 'meta']
    .concat(REGISTER_KEYS.map(k => REGISTERS[k].collection));
  for (const s of subs) await deleteAllInSubcollection(clinicId, s);
  // Must run before the Firestore user docs are deleted below — the Cloud Function looks
  // up who belongs to this clinic via those same records. Silently returns null if the

async function nextBookingId(registerKey) {
  const counterRef = doc(db, 'clinics', state.clinicId, 'counters', registerKey);
  const seq = await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const next = (snap.exists() ? snap.data().seq : 0) + 1;
    tx.set(counterRef, { seq: next }, { merge: true });
    return next;
  });
  return `${REGISTERS[registerKey].idPrefix}-${String(seq).padStart(6, '0')}`;
}

/* ---- Precomputed summary accounting (clinics/{id}/meta/dashboardSummary + monthlySummaries/{registerKey_monthKey}) ----
   Why: reading every booking on every Dashboard/Reports visit is fine at hundreds of rows, expensive
   at thousands. Instead we keep small running totals that are updated with targeted increment()
   writes staged into the SAME batch as the booking write itself — one network round trip either
   way, and the counts can never drift from a partially-applied write. reconcileClinicSummary()
   below is the full-recompute safety net for the rarer edge cases (e.g. data edited directly in
   the Firebase console) — cheap to run on demand from Settings, not needed for normal use. */
function stageBookingSummaryChange(batch, clinicId, registerKey, oldRow, newRow) {
  // Accumulate as plain numeric deltas first, THEN convert to increment() sentinels — this
  // mirrors the monthDeltas pattern just below. Writing increment() directly per bumpDs()
  // call was the bug: an edit calls bumpDs twice (old row -1, new row +1) against the SAME
  // dsPatch key, and a plain object-property assignment overwrites rather than adds, so only
  // the second increment() ever survived. Every save of an existing booking was silently
  // adding +1 to that register's total (and to the status count too, whenever the status
  // didn't change) even though no booking was actually added.
  const dsDeltas = {};
  function bumpDs(row, mult) { if (!row) return; const s = row.status || 'Booked'; dsDeltas[`${registerKey}_total`] = (dsDeltas[`${registerKey}_total`] || 0) + mult; dsDeltas[`${registerKey}_${s}`] = (dsDeltas[`${registerKey}_${s}`] || 0) + mult; }
  bumpDs(oldRow, -1); bumpDs(newRow, 1);
  const dsPatch = {};
  Object.keys(dsDeltas).forEach((k) => { if (dsDeltas[k]) dsPatch[k] = increment(dsDeltas[k]); });
  if (Object.keys(dsPatch).length) { dsPatch.updatedAt = serverTimestamp(); batch.set(doc(db, 'clinics', clinicId, 'meta', 'dashboardSummary'), dsPatch, { merge: true }); }

  const monthDeltas = {}; // monthKey -> { total, [status]: n }
  function touch(row, mult) {
    if (!row || !row.appointmentDate) return;
    const mk = row.appointmentDate.slice(0, 7), s = row.status || 'Booked';
    if (!monthDeltas[mk]) monthDeltas[mk] = {};
    monthDeltas[mk].total = (monthDeltas[mk].total || 0) + mult;
    monthDeltas[mk][s] = (monthDeltas[mk][s] || 0) + mult;
  }
  touch(oldRow, -1); touch(newRow, 1);
  Object.keys(monthDeltas).forEach((mk) => {
    const d = monthDeltas[mk];
    const patch = { registerKey, monthKey: mk, updatedAt: serverTimestamp() };
    Object.keys(d).forEach((k) => { if (d[k]) patch[k] = increment(d[k]); });
    if (Object.keys(patch).length > 3) batch.set(doc(db, 'clinics', clinicId, 'monthlySummaries', `${registerKey}_${mk}`), patch, { merge: true });
  });
}

/* ---------- Audit trail: every create/edit/delete/restore is logged, field by field ---------- */
const HISTORY_FIELD_LABELS = {
  appointmentDate: 'Appointment Date', timeSlot: 'Time Slot', patientName: 'Patient Name',
  mobileNumber: 'Mobile Number', priority: 'Priority', source: 'Booking Source', status: 'Status',
  remarks: 'Remarks', doctorName: 'Doctor Name', specialty: 'Specialty', treatmentType: 'Treatment Type',
  requestedTests: 'Requested Tests', address: 'Address', area: 'Area / Locality', pin: 'PIN Code'
};
function diffBookingFields(oldData, newData) {
  const changes = [];
  Object.keys(HISTORY_FIELD_LABELS).forEach((key) => {
    if (!(key in newData) && !(oldData && key in oldData)) return; // field not relevant to this register
    let ov = oldData ? oldData[key] : undefined;
    let nv = newData[key];
    if (Array.isArray(ov) || Array.isArray(nv)) { ov = (ov || []).join(', '); nv = (nv || []).join(', '); }
    ov = (ov === undefined || ov === null) ? '' : String(ov);
    nv = (nv === undefined || nv === null) ? '' : String(nv);
    if (ov !== nv) changes.push({ field: key, label: HISTORY_FIELD_LABELS[key], from: ov || '—', to: nv || '—' });
  });
  return changes;
}
async function logBookingHistory(registerKey, bookingDocId, action, changes, related) {
  try {
    const entry = { action, changes: changes || null, by: state.user.uid, byName: state.user.name, at: serverTimestamp() };
    if (related) entry.related = related; // { bookingDocId, bookingId } — the other half of a reschedule pair
    await addDoc(collection(db, 'clinics', state.clinicId, REGISTERS[registerKey].collection, bookingDocId, 'history'), entry);
  } catch (err) { console.error('History log failed:', err); }
}

  return snap.docs.map(d => ({ id: d.id, ...d.data() }));

/* ---- Reconciliation: full recompute, for the "Recalculate Summary" button in Settings.
   Not needed for normal use (every mutation already keeps the summary in sync as it happens) —
   this is the safety net for drift, e.g. if data was ever edited directly in the Firebase
   console. Reads every non-deleted booking once and rewrites the summary docs with set()
   (not increment()) so the result is exactly correct regardless of any prior drift. ---- */
async function reconcileClinicSummary(clinicId) {
  const dsPatch = {};
  const monthTotals = {}; // `${registerKey}_${monthKey}` -> { registerKey, monthKey, counts:{status:n} }
  for (const registerKey of REGISTER_KEYS) {
    const snap = await getDocs(collection(db, 'clinics', clinicId, REGISTERS[registerKey].collection));
    snap.docs.forEach((d) => {
      const row = d.data();
      if (row.deleted) return;
      const s = row.status || 'Booked';
      dsPatch[`${registerKey}_total`] = (dsPatch[`${registerKey}_total`] || 0) + 1;
      dsPatch[`${registerKey}_${s}`] = (dsPatch[`${registerKey}_${s}`] || 0) + 1;
      if (row.appointmentDate) {
        const mk = row.appointmentDate.slice(0, 7), key = `${registerKey}_${mk}`;
        if (!monthTotals[key]) monthTotals[key] = { registerKey, monthKey: mk, counts: {} };
        monthTotals[key].counts.total = (monthTotals[key].counts.total || 0) + 1;
        monthTotals[key].counts[s] = (monthTotals[key].counts[s] || 0) + 1;
      }
    });
  }
  dsPatch.updatedAt = serverTimestamp();
  await setDoc(doc(db, 'clinics', clinicId, 'meta', 'dashboardSummary'), dsPatch); // no merge: replaces stale fields too
  const monthKeys = Object.keys(monthTotals);
  for (let i = 0; i < monthKeys.length; i += 1) {
    const m = monthTotals[monthKeys[i]];
    await setDoc(doc(db, 'clinics', clinicId, 'monthlySummaries', monthKeys[i]), { registerKey: m.registerKey, monthKey: m.monthKey, updatedAt: serverTimestamp(), ...m.counts });
  }
  return { registers: REGISTER_KEYS.length, months: monthKeys.length };
}
async function getDashboardSummary(clinicId) {
  const snap = await getDoc(doc(db, 'clinics', clinicId, 'meta', 'dashboardSummary'));
  return snap.exists() ? snap.data() : {};
}
function monthKeysBetween(fromMonth, toMonth) {
  const keys = [];
  let [y, m] = fromMonth.split('-').map(Number);
  const [ey, em] = toMonth.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) {
    keys.push(`${y}-${pad2(m)}`);
    m += 1; if (m > 12) { m = 1; y += 1; }
    if (keys.length > 240) break; // 20 years, safety valve
  }
  return keys;
}
async function getMonthlySummaries(clinicId, registerKey, fromMonth, toMonth) {
  const months = monthKeysBetween(fromMonth, toMonth);
  const snaps = await Promise.all(months.map(mk => getDoc(doc(db, 'clinics', clinicId, 'monthlySummaries', `${registerKey}_${mk}`))));
  return snaps.filter(s => s.exists()).map(s => s.data());
}

// Fetch rows for a register's list view. Search and date-range are mutually
// exclusive at the query level (both filter on a single field each) so that
// no Firestore composite indexes are ever required for this app.
async function fetchRegisterRows(registerKey, { dateFrom, dateTo, searchTerm, includeDeleted }) {
  const colRef = collection(db, 'clinics', state.clinicId, REGISTERS[registerKey].collection);
  let rows = [];
  const term = (searchTerm || '').trim();
  if (term) {
    const looksLikeId = new RegExp('^' + REGISTERS[registerKey].idPrefix + '-?\\d+$', 'i').test(term);
    if (looksLikeId) {
      const normalized = term.toUpperCase().replace(/^([A-Z]+)-?(\d+)$/, (m, p, n) => `${p}-${n.padStart(6, '0')}`);
      const snap = await getDocs(query(colRef, where('bookingId', '==', normalized), limit(20)));
      rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      const termLower = term.toLowerCase();
      const [nameSnap, mobileSnap] = await Promise.all([
        getDocs(query(colRef, where('patientNameLower', '>=', termLower), where('patientNameLower', '<=', termLower + '\uf8ff'), limit(60))),
        getDocs(query(colRef, where('mobileNumber', '>=', term), where('mobileNumber', '<=', term + '\uf8ff'), limit(60)))
      ]);
      const map = new Map();
      nameSnap.docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() }));
      mobileSnap.docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() }));
      rows = Array.from(map.values());
    }
  } else {
    const snap = await getDocs(query(colRef, where('appointmentDate', '>=', dateFrom), where('appointmentDate', '<=', dateTo), limit(500)));
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  rows = rows.filter(r => (includeDeleted ? true : !r.deleted));
  const earliest = earliestVisibleDate();
  if (earliest) rows = rows.filter(r => !r.appointmentDate || r.appointmentDate >= earliest);
  rows.sort((a, b) => {
    const dc = (a.appointmentDate || '').localeCompare(b.appointmentDate || '');
    return dc !== 0 ? dc : timeSlotSortKey(a.timeSlot) - timeSlotSortKey(b.timeSlot);
  });
  return rows;
}
async function fetchDeletedRegisterRows(registerKey, dateFrom, dateTo) {
  const rows = await fetchRegisterRows(registerKey, { dateFrom, dateTo, includeDeleted: true });
  return rows.filter(r => r.deleted);
}

  return (err && err.message) || 'Something went wrong.';
}

function wireRegisterListToolbar(registerKey) {
  const cache = state.registerCache[registerKey];
  const f = cache.filters;
  const searchInput = document.getElementById('rl-search');
  const fromInput = document.getElementById('rl-from'), toInput = document.getElementById('rl-to');
  function syncDateDisabled() { const searching = !!searchInput.value.trim(); fromInput.disabled = searching; toInput.disabled = searching; }
  syncDateDisabled();
  searchInput.addEventListener('input', debounce(() => { f.search = searchInput.value; syncDateDisabled(); loadAndRenderRegisterRows(registerKey); }, 400));
  fromInput.addEventListener('change', () => { f.dateFrom = fromInput.value; loadAndRenderRegisterRows(registerKey); });
  toInput.addEventListener('change', () => { f.dateTo = toInput.value; loadAndRenderRegisterRows(registerKey); });
  document.getElementById('rl-priority').addEventListener('change', (e) => { f.priority = e.target.value || 'All'; applyClientFiltersAndRender(registerKey); });
  document.getElementById('rl-status').addEventListener('change', (e) => { f.status = e.target.value || 'All'; applyClientFiltersAndRender(registerKey); });
  const recycleBtn = document.getElementById('rl-recycle');
  if (recycleBtn) recycleBtn.addEventListener('click', () => navigateTo('recycle-bin', { kind: registerKey }));
  const importBtn = document.getElementById('rl-import');
  if (importBtn) importBtn.addEventListener('click', () => openImportModal(registerKey));
  document.getElementById('rl-new').addEventListener('click', () => navigateTo('register-form', { registerKey, id: null }));
  document.getElementById('rl-export').addEventListener('click', () => exportRegisterToExcel(registerKey));
}
async function loadAndRenderRegisterRows(registerKey) {
  const cache = state.registerCache[registerKey];
  const f = cache.filters;
  const slot = document.getElementById('rl-table-slot');
  slot.innerHTML = loaderHtml();
  try {
    cache.rawRows = await fetchRegisterRows(registerKey, { dateFrom: f.dateFrom, dateTo: f.dateTo, searchTerm: f.search });
    applyClientFiltersAndRender(registerKey);
  } catch (err) {
    console.error(err);
    slot.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Could not load bookings</h4><p>${escapeHtml(err.message || 'Please try again.')}</p></div>`;
  }
}
function applyClientFiltersAndRender(registerKey) {
  const cache = state.registerCache[registerKey];
  const f = cache.filters;
  let rows = cache.rawRows || [];
  if (f.status !== 'All') rows = rows.filter(r => r.status === f.status);
  if (f.priority && f.priority !== 'All') rows = rows.filter(r => (r.priority || 'Normal') === f.priority);
  // Newest-entered booking first, regardless of its own appointment date/time, so the last
  // thing added is always visible at the top without paging or scrolling to find it.
  rows = rows.slice().sort((a, b) => tsToMillis(b.bookedOn) - tsToMillis(a.bookedOn));
  cache.allRows = rows;
  cache.page = 1;
  renderRegisterTablePage(registerKey);
}
function registerCellValue(reg, r, key) {
  if (key === 'bookingId') return `<span class="id-cell">${escapeHtml(r.bookingId)}</span>`;
  if (key === 'appointmentDate') return escapeHtml(formatDateHuman(r.appointmentDate));
  if (key === 'testsSummary') return escapeHtml((r.requestedTests || []).join(', ') || '—');
  return escapeHtml(r[key] || '—');
}
function registerRowHtml(reg, r) {
  const statusClass = 'st-' + (r.status || 'Booked').toLowerCase();
