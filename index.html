<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareDesk · Appointment Booking Register</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230E7C7B%22/><path d=%22M28 20h44a6 6 0 0 1 6 6v46a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6Z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22/><path d=%22M22 40h56M36 14v14M64 14v14%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22/><path d=%22M35 58l9 9 19-19%22 stroke=%22white%22 stroke-width=%227%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CAREDESK DESIGN SYSTEM — "Clinic Ledger"
   Same premium clinical-teal + paper foundation as the CXDX
   reference app. Signature motif changed from an ECG pulse to a
   drawn calendar-check (booking / confirmed-visit), since this
   app is about scheduling, not prescription analysis.
   ============================================================ */
:root{
  --ink-900:#0B1F26;
  --ink-800:#122A31;
  --ink-700:#1C3438;
  --teal-700:#0B6665;
  --teal-600:#0E7C7B;
  --teal-500:#14948F;
  --teal-400:#3FB0AB;
  --teal-100:#DCF0EE;
  --teal-50:#EFF8F7;
  --green-600:#178A56;
  --green-500:#1FAA6D;
  --green-100:#DEF3E8;
  --amber-600:#B5620D;
  --amber-500:#DE7F1E;
  --amber-100:#FBEAD4;
  --red-600:#DC2626;
  --red-100:#FDE4E4;
  --violet-600:#6D4AAE;
  --violet-500:#8562C7;
  --violet-100:#EDE7F9;
  --blue-600:#1D5FBF;
  --blue-500:#2E77E0;
  --blue-100:#E1EBFC;
  --paper-50:#F5F8F7;
  --paper-0:#FFFFFF;
  --line-200:#DCE6E4;
  --line-100:#EAF1EF;
  --slate-600:#3F5257;
  --slate-500:#5B7278;
  --slate-400:#7E9297;
  --slate-300:#A7B8BB;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --shadow-sm:0 1px 3px rgba(11,31,38,0.07);
  --shadow-md:0 6px 20px rgba(11,31,38,0.08);
  --shadow-lg:0 16px 40px rgba(11,31,38,0.14);
  --ease:cubic-bezier(.4,0,.2,1);
  --transition:200ms var(--ease);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper-50);
  color:var(--ink-900);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::selection{background:var(--teal-100);color:var(--teal-700);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-200);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-300);}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);}
.u-flex{display:flex;}
.u-between{display:flex;align-items:center;justify-content:space-between;}
.u-gap-8{gap:8px;} .u-gap-12{gap:12px;}
.u-muted{color:var(--slate-500);}
.u-center{display:flex;align-items:center;justify-content:center;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   BRAND MARK — signature motif, reused sparingly.
   A calendar tile draws itself in, then a check tick confirms it —
   read as "date set, booking confirmed" on load.
   ============================================================ */
.brand-logo{display:inline-flex;align-items:center;gap:10px;}
.brand-logo .mark{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(155deg,var(--teal-600),var(--ink-800));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.brand-logo .mark svg{width:23px;height:23px;overflow:visible;}
.brand-logo .mark .cal-body{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw-cal 0.9s var(--ease) 0.1s forwards;}
.brand-logo .mark .cal-check{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:draw-check 0.35s var(--ease) 0.85s forwards;}
@keyframes draw-cal{to{stroke-dashoffset:0;}}
@keyframes draw-check{to{stroke-dashoffset:0;}}
.brand-logo .wordmark{
  font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.5px;
  background:linear-gradient(100deg,var(--ink-900) 30%,var(--teal-600) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-logo.on-dark .wordmark{
  background:linear-gradient(100deg,#fff 30%,var(--teal-400) 75%);
  -webkit-background-clip:text;background-clip:text;
}
.brand-logo .tagline{font-size:11px;color:var(--slate-400);letter-spacing:0.3px;margin-top:1px;}

/* traveling highlight dot orbiting a soft arc, used on login hero — replaces the old ECG trace
   with motion that reads as "always scheduling / always on". */
.brand-trace{position:relative;width:100%;max-width:360px;height:34px;margin:0 auto;}
.brand-trace svg{width:100%;height:100%;overflow:visible;}
.brand-trace path{
  fill:none;stroke:var(--teal-500);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:6 460;stroke-dashoffset:0;
  animation:trace-run 3.2s linear infinite;
  opacity:0.85;
}
.brand-trace path.ghost{stroke:var(--line-200);stroke-dasharray:none;opacity:1;animation:none;stroke-width:1.5;}
@keyframes trace-run{
  0%{stroke-dasharray:6 460;stroke-dashoffset:0;}
  85%{stroke-dasharray:6 460;stroke-dashoffset:-460;}
  100%{stroke-dasharray:6 460;stroke-dashoffset:-466;}
}

/* Compact traveling-trace loading state for buttons — same technique, sized to sit inline. */
.btn-trace{display:inline-flex;align-items:center;}
.btn-trace svg{width:44px;height:16px;overflow:visible;}
.btn-trace path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-trace path.ghost{stroke:var(--teal-100);}
.btn-trace path.run{stroke:var(--teal-700);stroke-dasharray:4 76;stroke-dashoffset:0;animation:btn-trace-run 1.4s linear infinite;}
@keyframes btn-trace-run{
  0%{stroke-dashoffset:0;}
  85%{stroke-dashoffset:-76;}
  100%{stroke-dashoffset:-80;}
}
@media (prefers-reduced-motion: reduce){.btn-trace path.run{animation:none;stroke-dasharray:none;}}

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;background:var(--paper-50);
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(600px 300px at 15% 0%, var(--teal-100) 0%, transparent 60%),
    radial-gradient(500px 260px at 100% 100%, var(--amber-100) 0%, transparent 55%);
  opacity:0.7;pointer-events:none;
}
.login-hero{position:relative;text-align:center;margin-bottom:28px;animation:rise-in 0.7s var(--ease) both;}
.login-hero .brand-logo{justify-content:center;transform:scale(1.15);margin-bottom:10px;}
.login-hero h1{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--slate-500);letter-spacing:0.2px;margin-top:6px;}
.login-card{
  position:relative;width:100%;max-width:388px;background:var(--paper-0);
  border:1px solid var(--line-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:32px 30px 28px;animation:rise-in 0.7s var(--ease) 0.1s both;
}
@keyframes rise-in{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.login-card .field{margin-bottom:16px;}
.login-card label{display:block;font-size:12.5px;font-weight:600;color:var(--slate-600);margin-bottom:6px;letter-spacing:0.15px;}
.login-card input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line-200);border-radius:var(--radius-sm);
  background:var(--paper-50);transition:border-color var(--transition),background var(--transition);
}
.login-card input:focus{outline:none;border-color:var(--teal-500);background:var(--paper-0);}
#login-error{
  display:none;background:var(--red-100);color:var(--red-600);font-size:13px;font-weight:500;
  padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;
}
.login-foot{text-align:center;margin-top:22px;}
.login-foot .brand-trace{opacity:0.8;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;border-radius:var(--radius-sm);border:1.5px solid transparent;
  padding:10px 18px;transition:transform 120ms var(--ease),box-shadow var(--transition),background var(--transition),border-color var(--transition),opacity var(--transition);
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-block{width:100%;}
.btn-primary{background:linear-gradient(120deg,var(--teal-600),var(--teal-700));color:#fff;box-shadow:0 2px 10px rgba(14,124,123,0.28);}
.btn-primary:hover{box-shadow:0 4px 16px rgba(14,124,123,0.36);}
.btn-secondary{background:var(--paper-0);color:var(--ink-900);border-color:var(--line-200);}
.btn-secondary:hover{border-color:var(--teal-400);color:var(--teal-700);}
.btn-ghost{background:transparent;color:var(--slate-600);}
.btn-ghost:hover{background:var(--line-100);}
.btn-danger{background:var(--paper-0);color:var(--red-600);border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
.btn-danger-solid{background:var(--red-600);color:#fff;}
.btn-danger-solid:hover{background:#c41f1f;}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1.5px solid transparent;color:var(--slate-500);transition:all var(--transition);
}
.icon-btn:hover{background:var(--line-100);color:var(--ink-900);}
.icon-btn.danger:hover{background:var(--red-100);color:var(--red-600);}
.icon-btn svg{width:17px;height:17px;}

/* ============================================================
   APP SHELL
   ============================================================ */
#app-shell{display:flex;min-height:100vh;}
#sidebar{
  width:242px;flex-shrink:0;background:var(--ink-900);color:#fff;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform var(--transition);
}
#sidebar .side-head{padding:22px 20px 16px;}
#sidebar .brand-logo{transform:scale(0.92);transform-origin:left center;}
.branch-chip{
  margin:2px 20px 14px;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;font-size:12px;color:var(--teal-400);display:flex;align-items:center;gap:7px;
}
.branch-chip svg{width:14px;height:14px;flex-shrink:0;}
.branch-chip b{color:#fff;font-weight:600;display:block;font-size:12.5px;}
nav.side-nav{flex:1;padding:6px 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;margin-bottom:2px;
  color:rgba(255,255,255,0.62);font-size:13.5px;font-weight:500;position:relative;cursor:pointer;
  transition:background var(--transition),color var(--transition);
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(20,148,143,0.22);color:#fff;}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;
  background:var(--teal-400);border-radius:0 3px 3px 0;
}
.nav-group-label{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.32);text-transform:uppercase;letter-spacing:0.6px;padding:14px 12px 6px;}
#sidebar .side-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--teal-500),var(--teal-700));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;
}
.user-chip .who{overflow:hidden;}
.user-chip .who .nm{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .who .rl{font-size:11px;color:rgba(255,255,255,0.45);text-transform:capitalize;}
.sidebar-trace{height:26px;margin-top:6px;opacity:0.5;}
.sidebar-trace svg{width:100%;height:100%;}
.sidebar-trace path{fill:none;stroke:var(--teal-400);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 300;animation:trace-run 4s linear infinite;}

#main-col{margin-left:242px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
#topbar{
  height:64px;flex-shrink:0;background:var(--paper-0);border-bottom:1px solid var(--line-200);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30;
}
#topbar .crumb{font-family:var(--font-display);font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:10px;}
#topbar .crumb .sub{font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--slate-400);}
#menu-toggle{display:none;}
#content{flex:1;padding:26px;max-width:1360px;width:100%;}
.view{animation:fade-up 0.35s var(--ease) both;}
@keyframes fade-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   CARDS / STATS
   ============================================================ */
.card{background:var(--paper-0);border:1px solid var(--line-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:22px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-100);}
.card-head h3{font-family:var(--font-display);font-size:15px;font-weight:600;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:var(--paper-0);border:1px solid var(--line-200);border-radius:var(--radius-md);padding:18px 20px;
  transition:transform var(--transition),box-shadow var(--transition);position:relative;overflow:hidden;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card .lbl{font-size:11.5px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;}
.stat-card .val{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;color:var(--ink-900);}
.stat-card .delta{font-size:12px;margin-top:5px;font-weight:600;}
.stat-card.accent-teal{border-top:3px solid var(--teal-500);}
.stat-card.accent-green{border-top:3px solid var(--green-500);}
.stat-card.accent-amber{border-top:3px solid var(--amber-500);}
.stat-card.accent-ink{border-top:3px solid var(--ink-700);}
.stat-card.accent-violet{border-top:3px solid var(--violet-500);}
.stat-card.accent-blue{border-top:3px solid var(--blue-500);}
.stat-card.accent-red{border-top:3px solid var(--red-600);}
.stat-card .val.c-green{color:var(--green-600);}
.stat-card .val.c-amber{color:var(--amber-600);}
.stat-card .val.c-violet{color:var(--violet-600);}

/* ---------- Dashboard stat icon badges (colorful, animated) ---------- */
.stat-icon-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:6px;flex-shrink:0;
  animation:statBadgePulse 2.6s ease-in-out infinite;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.stat-icon-badge svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;}
.stat-card:hover .stat-icon-badge{transform:scale(1.14) translateY(-1px);animation-play-state:paused;box-shadow:0 5px 12px 0 var(--glow);}
.stat-icon-badge.badge-ink{background:linear-gradient(135deg,var(--ink-700),var(--ink-900));--glow:rgba(11,31,38,.5);}
.stat-icon-badge.badge-teal{background:linear-gradient(135deg,var(--teal-400),var(--teal-700));--glow:rgba(14,148,143,.5);}
.stat-icon-badge.badge-green{background:linear-gradient(135deg,#42D68C,var(--green-600));--glow:rgba(23,138,86,.5);}
.stat-icon-badge.badge-amber{background:linear-gradient(135deg,#F7AC4D,var(--amber-600));--glow:rgba(181,98,13,.5);}
.stat-icon-badge.badge-violet{background:linear-gradient(135deg,#A98AE0,var(--violet-600));--glow:rgba(109,74,174,.5);}
.stat-icon-badge.badge-blue{background:linear-gradient(135deg,#6FA3EE,var(--blue-600));--glow:rgba(29,95,191,.5);}
.stat-icon-badge.badge-red{background:linear-gradient(135deg,#F0716B,var(--red-600));--glow:rgba(220,38,38,.5);}
@keyframes statBadgePulse{
  0%,100%{box-shadow:0 2px 5px -1px var(--glow);}
  50%{box-shadow:0 3px 10px 0 var(--glow);}
}
@media (prefers-reduced-motion: reduce){.stat-icon-badge{animation:none;}}

/* ============================================================
   FORMS
   ============================================================ */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.field-wrap{display:flex;flex-direction:column;gap:6px;}
.hint{font-size:11.5px;color:var(--slate-400);}
.banner-icon{width:18px;height:18px;flex-shrink:0;}
.banner-icon svg{width:18px;height:18px;}
.field-wrap.span-2{grid-column:span 2;}
.field-wrap label{font-size:12.5px;font-weight:600;color:var(--slate-600);}
.field-wrap label .req{color:var(--amber-600);}
.field-wrap .hint{font-size:11px;color:var(--slate-400);}
.field-wrap .err{font-size:11.5px;color:var(--red-600);display:none;font-weight:500;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line-200);border-radius:var(--radius-sm);
  background:var(--paper-0);color:var(--ink-900);transition:border-color var(--transition);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-500);}
input.invalid,select.invalid{border-color:var(--red-600);}
select{appearance:none;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235B7278' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;}

.search-select{position:relative;}
.search-select .ss-input{cursor:text;}
.search-select .ss-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--paper-0);border:1.5px solid var(--line-200);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-md);max-height:230px;overflow-y:auto;z-index:60;
}
.search-select .ss-option{padding:9px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-900);}
.search-select .ss-option:hover,.search-select .ss-option.active{background:var(--teal-50);}
.search-select .ss-empty{padding:9px 12px;font-size:13px;color:var(--slate-400);}
textarea{resize:vertical;min-height:64px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate-600);}

.multi-row{
  display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;margin-bottom:10px;
  padding:12px 14px 12px 40px;background:var(--paper-50);border-radius:var(--radius-sm);border:1px solid var(--line-100);position:relative;
}
.multi-row .row-num{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  background:var(--teal-100);color:var(--teal-700);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function formatInt(n) { return (n || 0).toLocaleString('en-IN'); }
function debounce(fn, wait) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function formatDateHuman(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateTimeHuman(input) {
  let d;
  if (!input) return '—';
  if (typeof input.toDate === 'function') d = input.toDate();
  else d = new Date(input);
  if (isNaN(d)) return '—';
  return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v || '').trim()); }
function validateMobile(v) {
  const digits = (v || '').replace(/[^\d]/g, '');
  return digits.length >= 7 && digits.length <= 15;
}
function normalizeMobile(v) { return (v || '').replace(/[^\d+]/g, ''); }
function initialsOf(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

/* ---------- Toast ---------- */
function toast(message, kind) {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = `toast ${kind || 'info'}`;
  const iconName = kind === 'success' ? 'check' : kind === 'error' ? 'alertTriangle' : 'info';
  el.innerHTML = `${icon(iconName)}<span>${escapeHtml(message)}</span>`;
  stack.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 3400);
}

/* ---------- Modal ---------- */
function openModal(html, opts) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" data-close="1"></div><div class="modal-box${opts && opts.wide ? ' wide' : ''}">${html}</div>`;
  root.classList.add('show');
  root.querySelector('.modal-backdrop').addEventListener('mousedown', () => { if (!(opts && opts.persistent)) closeModal(); });
  document.addEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const root = document.getElementById('modal-root');
  root.classList.remove('show');
  root.innerHTML = '';
  document.removeEventListener('keydown', modalEscHandler);
}
function confirmDialog({ title, message, confirmLabel, danger, extra }) {
  return new Promise((resolve) => {
    openModal(`
      <div class="modal-head"><h3>${escapeHtml(title || 'Are you sure?')}</h3><button class="icon-btn" id="cd-x">${icon('x')}</button></div>
      <div class="modal-body"><p style="font-size:13.5px;color:var(--slate-600);line-height:1.55;">${message || ''}</p>${extra || ''}</div>
      <div class="modal-foot"><button class="btn btn-secondary" id="cd-cancel">Cancel</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" id="cd-ok">${escapeHtml(confirmLabel || 'Confirm')}</button></div>
    `, { persistent: true });
    const finish = (v) => { closeModal(); resolve(v); };
    document.getElementById('cd-x').addEventListener('click', () => finish(false));
    document.getElementById('cd-cancel').addEventListener('click', () => finish(false));
    document.getElementById('cd-ok').addEventListener('click', () => finish(true));
  });
}

/* ---------- Button loading state ---------- */
function setBtnLoading(btn, loading, labelWhenLoading) {
  if (!btn) return;
  if (loading) {
    btn.dataset.originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="loader-ring" style="width:15px;height:15px;border-width:2px;"></span>${labelWhenLoading ? `<span>${escapeHtml(labelWhenLoading)}</span>` : ''}`;
  } else {
    btn.disabled = false;
    if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
  }
}

/* ---------- Animated count-up for stat cards ---------- */
function animateCountUp(el, end) {
  if (!el) return;
  const start = 0, dur = 700, t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatInt(Math.round(start + (end - start) * eased));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------- Search-select (typeahead) component ---------- */
function initSearchSelect(id, options, initialValue, onSelect, blankLabel) {
  const root = document.getElementById(id);
  if (!root) return null;
  let opts = options.slice();
  if (initialValue && !opts.some(o => o.value === initialValue)) opts = [{ value: initialValue, label: initialValue + ' (custom)' }].concat(opts);
  let value = initialValue || '';
  function labelFor(v) { if (blankLabel !== undefined && v === blankLabel) return ''; const o = opts.find(x => x.value === v); return o ? o.label : ''; }
  root.innerHTML = `<input type="text" class="ss-input" autocomplete="off" placeholder="${blankLabel !== undefined ? escapeHtml(blankLabel) : 'Type to search…'}" value="${escapeHtml(labelFor(value))}"><div class="ss-dropdown hidden"></div>`;
  const input = root.querySelector('.ss-input'), dropdown = root.querySelector('.ss-dropdown');
  let activeIndex = -1, visible = [];
  function renderList(term) {
    const t = (term || '').trim().toLowerCase();
    visible = t ? opts.filter(o => o.label.toLowerCase().includes(t)) : opts;
    activeIndex = -1;
    dropdown.innerHTML = visible.length ? visible.slice(0, 60).map((o, i) => `<div class="ss-option" data-i="${i}">${escapeHtml(o.label)}</div>`).join('') : `<div class="ss-empty">No matches</div>`;
    dropdown.classList.remove('hidden');
    dropdown.querySelectorAll('.ss-option').forEach(el => el.addEventListener('mousedown', (e) => { e.preventDefault(); choose(visible[+el.dataset.i]); }));
  }
  function choose(opt) {
    value = opt ? opt.value : (blankLabel !== undefined ? blankLabel : '');
    input.value = labelFor(value);
    dropdown.classList.add('hidden');
    if (onSelect) onSelect(value, opt);
  }
  function highlight(i) {
    activeIndex = i;
    dropdown.querySelectorAll('.ss-option').forEach((el, idx) => el.classList.toggle('active', idx === i));
    const el = dropdown.querySelector(`.ss-option[data-i="${i}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('focus', () => renderList(''));
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', (e) => {
    if (dropdown.classList.contains('hidden') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { renderList(input.value); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight(Math.min(activeIndex + 1, visible.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(Math.max(activeIndex - 1, 0)); }
    else if (e.key === 'Enter') { if (activeIndex >= 0 && visible[activeIndex]) { e.preventDefault(); e.stopPropagation(); choose(visible[activeIndex]); } }
    else if (e.key === 'Escape') { dropdown.classList.add('hidden'); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { dropdown.classList.add('hidden'); input.value = labelFor(value); }, 150);
  });
  return {
    getValue: () => value,
    setOptions: (newOptions, newValue) => {
      opts = newOptions.slice();
      if (newValue !== undefined) value = newValue;
      if (value && !opts.some(o => o.value === value)) opts = [{ value, label: value + ' (custom)' }].concat(opts);
      input.value = labelFor(value);
    }
  };
}

/* ---------- Time-slot generation from settings ---------- */
function generateTimeSlots(registerKey) {
  const s = state.settings || DEFAULT_SETTINGS;
  const mins = (s.slotMinutes && s.slotMinutes[registerKey]) || DEFAULT_SETTINGS.slotMinutes[registerKey] || 15;
  const [sh, sm] = (s.clinicStart || '09:00').split(':').map(Number);
  const [eh, em] = (s.clinicEnd || '20:00').split(':').map(Number);
  let cur = sh * 60 + sm;
  const end = eh * 60 + em;
  const slots = [];
  function fmt(mTotal) {
    let h = Math.floor(mTotal / 60), m = mTotal % 60;
    const ap = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${pad2(h12)}:${pad2(m)} ${ap}`;
  }
  while (cur + mins <= end) {
    slots.push(`${fmt(cur)} – ${fmt(cur + mins)}`);
    cur += mins;
  }
  return slots;
}

/* ---------- Simple select-options renderer ---------- */
function optionsHtml(list, current, opts) {
  opts = opts || {};
  let out = opts.blank ? `<option value="">${escapeHtml(opts.blank)}</option>` : '';
  out += list.map(v => `<option value="${escapeHtml(v)}" ${v === current ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return out;
}

async function loadBranchContext(branchId) {
  const branchSnap = await getDoc(doc(db, 'branches', branchId));
  if (!branchSnap.exists()) throw new Error('Branch not found.');
  const b = branchSnap.data();
  state.branchId = branchId;
  state.branchName = b.name || 'Branch';
  state.branchActive = b.active !== false;
  state.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings || {}, {
    slotMinutes: Object.assign({}, DEFAULT_SETTINGS.slotMinutes, (b.settings && b.settings.slotMinutes) || {}),
    bookingSources: (b.settings && b.settings.bookingSources && b.settings.bookingSources.length) ? b.settings.bookingSources : DEFAULT_SETTINGS.bookingSources.slice(),
    dentalTreatmentTypes: (b.settings && b.settings.dentalTreatmentTypes && b.settings.dentalTreatmentTypes.length) ? b.settings.dentalTreatmentTypes : DEFAULT_SETTINGS.dentalTreatmentTypes.slice()
  });
  const [docSnap, testSnap] = await Promise.all([
    getDocs(collection(db, 'branches', branchId, 'doctors')),
    getDocs(collection(db, 'branches', branchId, 'tests'))
  ]);
  state.doctors = docSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b2) => (a.name || '').localeCompare(b2.name || ''));
  state.tests = testSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b2) => (a.name || '').localeCompare(b2.name || ''));
}
function exitBranch() {
  state.branchId = null; state.branchName = ''; state.doctors = []; state.tests = []; state.settings = null;
  renderShellChrome();
  navigateTo('sa-branches');
}

async function loadUserProfileAndBegin(fbUser) {
  try {
    const snap = await getDoc(doc(db, 'users', fbUser.uid));
    if (!snap.exists()) { await signOut(auth); showLoginScreen('No profile found for this account. Contact your administrator.'); return; }
    const u = snap.data();
    if (u.deleted) { await signOut(auth); showLoginScreen('This account has been removed.'); return; }
    state.user = { uid: fbUser.uid, email: fbUser.email, name: u.name || fbUser.email, role: u.role, branchId: u.branchId || null, permissions: u.permissions || {} };
    state.isSuperAdmin = u.role === ROLES.SUPERADMIN;
    state.isAdmin = u.role === ROLES.ADMIN;
    state.isAgent = u.role === ROLES.AGENT;

    if (state.isSuperAdmin) {
      // Super admin starts at the branches list; branch context is loaded only after they enter one.
      showAppShell();
      renderShellChrome();
      navigateTo('sa-branches');
    } else {
      if (!u.branchId) { await signOut(auth); showLoginScreen('Your account is not linked to a branch. Contact your administrator.'); return; }
      await loadBranchContext(u.branchId);
      if (!state.branchActive) { await signOut(auth); showLoginScreen('Your branch has been deactivated. Contact your administrator.'); return; }
      showAppShell();
      renderShellChrome();
      navigateTo('dashboard');
    }
  } catch (err) {
    console.error(err);
    await signOut(auth).catch(() => {});
    showLoginScreen('Something went wrong loading your account. Please try again.');
  }
}

function wireAuthListeners() {
  onAuthStateChanged(auth, (fbUser) => {
    if (fbUser) loadUserProfileAndBegin(fbUser);
    else showLoginScreen();

  document.getElementById('login-card').addEventListener('submit', async (e) => {

async function bulkDeleteRegisterByDateRange(branchId, registerKey, fromISO, toISO) {
  const colRef = collection(db, 'branches', branchId, REGISTERS[registerKey].collection);
  const snap = await getDocs(query(colRef, where('appointmentDate', '>=', fromISO), where('appointmentDate', '<=', toISO)));
  if (snap.empty) return 0;
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 450) {
    const batch = writeBatch(db);
    docs.slice(i, i + 450).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  return docs.length;
}
async function deleteAllInSubcollection(branchId, subName) {
  const snap = await getDocs(collection(db, 'branches', branchId, subName));
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 450) {
    const batch = writeBatch(db);
    docs.slice(i, i + 450).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}
async function deleteBranchCascade(branchId) {
  const subs = ['doctors', 'tests', 'counters', 'monthlySummaries', 'meta']
    .concat(REGISTER_KEYS.map(k => REGISTERS[k].collection));
  for (const s of subs) await deleteAllInSubcollection(branchId, s);
  const usersSnap = await getDocs(query(collection(db, 'users'), where('branchId', '==', branchId)));
  const uDocs = usersSnap.docs;
  for (let i = 0; i < uDocs.length; i += 450) {
    const batch = writeBatch(db);
    uDocs.slice(i, i + 450).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  await deleteDoc(doc(db, 'branches', branchId));
}

async function addMaster(kind, data) {
  const ref = await addDoc(collection(db, 'branches', state.branchId, kind), data);
  const list = kind === 'doctors' ? state.doctors : state.tests;
  list.push({ id: ref.id, ...data });

}
async function updateMaster(kind, id, data) {
  await updateDoc(doc(db, 'branches', state.branchId, kind, id), data);
  const list = kind === 'doctors' ? state.doctors : state.tests;
  const idx = list.findIndex(x => x.id === id);
  if (idx > -1) list[idx] = { id, ...data };

async function deleteMaster(kind, id) {
  await deleteDoc(doc(db, 'branches', state.branchId, kind, id));
  const list = kind === 'doctors' ? state.doctors : state.tests;
  const idx = list.findIndex(x => x.id === id);

async function nextBookingId(registerKey) {
  const counterRef = doc(db, 'branches', state.branchId, 'counters', registerKey);
  const seq = await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const next = (snap.exists() ? snap.data().seq : 0) + 1;
    tx.set(counterRef, { seq: next }, { merge: true });
    return next;
  });
  return `${REGISTERS[registerKey].idPrefix}-${String(seq).padStart(6, '0')}`;
}
async function createBooking(registerKey, data) {
  const bookingId = await nextBookingId(registerKey);
  const payload = Object.assign({}, data, {
    bookingId,
    patientNameLower: (data.patientName || '').toLowerCase(),
    deleted: false,
    bookedBy: state.user.uid,
    bookedByName: state.user.name,
    bookedOn: serverTimestamp(),
    createdAt: serverTimestamp()
  });
  const ref = await addDoc(collection(db, 'branches', state.branchId, REGISTERS[registerKey].collection), payload);
  await logBookingHistory(registerKey, ref.id, 'created', null);
  return { id: ref.id, bookingId };
}
async function updateBooking(registerKey, id, data, oldData) {
  const payload = Object.assign({}, data, {
    patientNameLower: (data.patientName || '').toLowerCase(),
    updatedAt: serverTimestamp(),
    updatedBy: state.user.uid,
    updatedByName: state.user.name
  });
  await updateDoc(doc(db, 'branches', state.branchId, REGISTERS[registerKey].collection, id), payload);
  const changes = diffBookingFields(oldData, data);
  if (changes.length) await logBookingHistory(registerKey, id, 'updated', changes);
}

/* ---------- Audit trail: every create/edit/delete/restore is logged, field by field ---------- */
const HISTORY_FIELD_LABELS = {
  appointmentDate: 'Appointment Date', timeSlot: 'Time Slot', patientName: 'Patient Name',
  mobileNumber: 'Mobile Number', priority: 'Priority', source: 'Booking Source', status: 'Status',
  remarks: 'Remarks', doctorName: 'Doctor Name', specialty: 'Specialty', treatmentType: 'Treatment Type',
  requestedTests: 'Requested Tests', address: 'Address', area: 'Area / Locality', pin: 'PIN Code'
};
function diffBookingFields(oldData, newData) {
  const changes = [];
  Object.keys(HISTORY_FIELD_LABELS).forEach((key) => {
    if (!(key in newData) && !(oldData && key in oldData)) return; // field not relevant to this register
    let ov = oldData ? oldData[key] : undefined;
    let nv = newData[key];
    if (Array.isArray(ov) || Array.isArray(nv)) { ov = (ov || []).join(', '); nv = (nv || []).join(', '); }
    ov = (ov === undefined || ov === null) ? '' : String(ov);
    nv = (nv === undefined || nv === null) ? '' : String(nv);
    if (ov !== nv) changes.push({ field: key, label: HISTORY_FIELD_LABELS[key], from: ov || '—', to: nv || '—' });
  });
  return changes;
}

    });

async function fetchBookingHistory(registerKey, bookingDocId) {

// Fetch rows for a register's list view. Search and date-range are mutually
// exclusive at the query level (both filter on a single field each) so that
// no Firestore composite indexes are ever required for this app.
async function fetchRegisterRows(registerKey, { dateFrom, dateTo, searchTerm, includeDeleted }) {
  const colRef = collection(db, 'branches', state.branchId, REGISTERS[registerKey].collection);
  let rows = [];
  const term = (searchTerm || '').trim();
  if (term) {
    const looksLikeId = new RegExp('^' + REGISTERS[registerKey].idPrefix + '-?\\d+$', 'i').test(term);
    if (looksLikeId) {
      const normalized = term.toUpperCase().replace(/^([A-Z]+)-?(\d+)$/, (m, p, n) => `${p}-${n.padStart(6, '0')}`);
      const snap = await getDocs(query(colRef, where('bookingId', '==', normalized), limit(20)));
      rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      const termLower = term.toLowerCase();
      const [nameSnap, mobileSnap] = await Promise.all([
        getDocs(query(colRef, where('patientNameLower', '>=', termLower), where('patientNameLower', '<=', termLower + '\uf8ff'), limit(60))),
        getDocs(query(colRef, where('mobileNumber', '>=', term), where('mobileNumber', '<=', term + '\uf8ff'), limit(60)))
      ]);
      const map = new Map();
      nameSnap.docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() }));
      mobileSnap.docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() }));
      rows = Array.from(map.values());
    }
  } else {
    const snap = await getDocs(query(colRef, where('appointmentDate', '>=', dateFrom), where('appointmentDate', '<=', dateTo), limit(500)));
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  rows = rows.filter(r => (includeDeleted ? true : !r.deleted));
  rows.sort((a, b) => (a.appointmentDate + (a.timeSlot || '')).localeCompare(b.appointmentDate + (b.timeSlot || '')));
  return rows;
}
async function fetchDeletedRegisterRows(registerKey, dateFrom, dateTo) {
  const rows = await fetchRegisterRows(registerKey, { dateFrom, dateTo, includeDeleted: true });
  return rows.filter(r => r.deleted);
}

async function loadAndRenderRegisterRows(registerKey) {
  const cache = state.registerCache[registerKey];
  const f = cache.filters;
  const slot = document.getElementById('rl-table-slot');
  slot.innerHTML = loaderHtml();
  try {
    cache.rawRows = await fetchRegisterRows(registerKey, { dateFrom: f.dateFrom, dateTo: f.dateTo, searchTerm: f.search });
    applyClientFiltersAndRender(registerKey);
  } catch (err) {
    console.error(err);
    slot.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Could not load bookings</h4><p>${escapeHtml(err.message || 'Please try again.')}</p></div>`;
  }
}
function applyClientFiltersAndRender(registerKey) {
  const cache = state.registerCache[registerKey];
  const f = cache.filters;
  let rows = cache.rawRows || [];
  if (f.status !== 'All') rows = rows.filter(r => r.status === f.status);
  if (f.priority && f.priority !== 'All') rows = rows.filter(r => (r.priority || 'Normal') === f.priority);
  cache.allRows = rows;
  cache.page = 1;
  renderRegisterTablePage(registerKey);
}
function registerCellValue(reg, r, key) {
  if (key === 'bookingId') return `<span class="id-cell">${escapeHtml(r.bookingId)}</span>`;
  if (key === 'appointmentDate') return escapeHtml(formatDateHuman(r.appointmentDate));
  if (key === 'testsSummary') return escapeHtml((r.requestedTests || []).join(', ') || '—');
  return escapeHtml(r[key] || '—');
}
function registerRowHtml(reg, r) {
  const statusClass = 'st-' + (r.status || 'Booked').toLowerCase();
  const priClass = 'pr-' + (r.priority || 'Normal').toLowerCase();
  return `<tr>
    ${reg.listCols.map(c => `<td>${registerCellValue(reg, r, c.k)}</td>`).join('')}
    <td><span class="badge ${statusClass}">${escapeHtml(r.status || 'Booked')}</span></td>
    <td><span class="badge ${priClass}">${escapeHtml(r.priority || 'Normal')}</span></td>
    <td>${escapeHtml(r.bookedByName || '—')}</td>
    <td><div class="u-flex u-gap-8">
      <button class="icon-btn" data-open="${r.id}" title="Open">${icon('edit')}</button>
      <button class="icon-btn danger" data-quickdel="${r.id}" data-bid="${escapeHtml(r.bookingId)}" title="Delete">${icon('trash')}</button>
    </div></td>
  </tr>`;
}
function paginationHtml(page, totalPages, totalCount) {
  return `<div class="u-between" style="flex-wrap:wrap;gap:10px;">
    <span class="u-muted" style="font-size:12.5px;">${formatInt(totalCount)} result(s) · Page ${page} of ${totalPages}</span>
    <div class="u-flex u-gap-8"><button class="btn btn-secondary btn-sm" id="pg-prev" ${page <= 1 ? 'disabled' : ''}>${icon('chevronLeft')}Prev</button><button class="btn btn-secondary btn-sm" id="pg-next" ${page >= totalPages ? 'disabled' : ''}>Next${icon('chevronRight')}</button></div>
  </div>`;
}
function renderRegisterTablePage(registerKey) {
  const reg = REGISTERS[registerKey];
  const cache = state.registerCache[registerKey];
  const rows = cache.allRows || [];
  const slot = document.getElementById('rl-table-slot');
  if (!rows.length) {
    slot.innerHTML = `<div class="empty-state">${icon(reg.icon)}<h4>No bookings found</h4><p>Try widening the date range, or clear the search and filters.</p></div>`;
    document.getElementById('rl-pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  cache.page = Math.min(cache.page, totalPages);
  const pageRows = rows.slice((cache.page - 1) * PAGE_SIZE, cache.page * PAGE_SIZE);
  slot.innerHTML = `<table><thead><tr>${reg.listCols.map(c => `<th>${c.h}</th>`).join('')}<th>Status</th><th>Priority</th><th>Booked By</th><th></th></tr></thead><tbody>${pageRows.map(r => registerRowHtml(reg, r)).join('')}</tbody></table>`;
  document.getElementById('rl-pagination').innerHTML = paginationHtml(cache.page, totalPages, rows.length);
  slot.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => navigateTo('register-form', { registerKey, id: el.dataset.open })));
  slot.querySelectorAll('[data-quickdel]').forEach(el => el.addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Delete booking?', danger: true, confirmLabel: 'Move to Recycle Bin', message: `Booking <b>${escapeHtml(el.dataset.bid)}</b> will be moved to the recycle bin.` });
    if (!ok) return;
    try { await softDeleteBooking(registerKey, el.dataset.quickdel); toast('Moved to recycle bin.', 'success'); loadAndRenderRegisterRows(registerKey); } catch (err) { toast(err.message, 'error'); }
  }));
  const prev = document.getElementById('pg-prev'), next = document.getElementById('pg-next');
  if (prev) prev.addEventListener('click', () => { cache.page = Math.max(1, cache.page - 1); renderRegisterTablePage(registerKey); });
  if (next) next.addEventListener('click', () => { cache.page = cache.page + 1; renderRegisterTablePage(registerKey); });
}
function exportRegisterToExcel(registerKey) {
  const reg = REGISTERS[registerKey];
  const cache = state.registerCache[registerKey];
  const rows = cache.allRows || [];
  if (!rows.length) { toast('Nothing to export.', 'error'); return; }
  const header = reg.listCols.map(c => c.h).concat(['Status', 'Priority', 'Source', 'Remarks', 'Booked By', 'Booked On']);
  const body = rows.map(r => reg.listCols.map(c => {
    if (c.k === 'appointmentDate') return formatDateHuman(r.appointmentDate);
    if (c.k === 'testsSummary') return (r.requestedTests || []).join(', ');
    return r[c.k] || '';
  }).concat([r.status || '', r.priority || '', r.source || '', r.remarks || '', r.bookedByName || '', formatDateTimeHuman(r.bookedOn)]));
  const ws = XLSX.utils.aoa_to_sheet([header].concat(body));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, reg.short.slice(0, 28));
  XLSX.writeFile(wb, `${reg.short.replace(/\s+/g, '_')}_Bookings_${todayISO()}.xlsx`);
}

}
function addTestMultiRow(container, initialName) {
  const wrap = document.createElement('div');
  wrap.className = 'multi-row';
  const ssId = 'ss-tr-' + Math.random().toString(36).slice(2, 9);
  wrap.innerHTML = `<div class="row-num"></div><div class="search-select" id="${ssId}"></div><button type="button" class="icon-btn danger" data-remove-row>${icon('x')}</button>`;
  container.appendChild(wrap);
  wrap._ssController = initSearchSelect(ssId, state.tests.map(t => ({ value: t.name, label: t.name })), initialName || '', null, 'Search test…');
  wrap.querySelector('[data-remove-row]').addEventListener('click', () => { wrap.remove(); renumberMultiRows(container); });
  renumberMultiRows(container);
}
function renumberMultiRows(container) { container.querySelectorAll('.multi-row').forEach((row, i) => { row.querySelector('.row-num').textContent = i + 1; }); }
function registerExtraFieldsInit(reg, existing) {
  if (reg.key === 'doctor' || reg.key === 'dental') {
    const ctrl = initSearchSelect('rf-doctor', state.doctors.map(d => ({ value: d.name, label: d.name + (d.specialty ? ' — ' + d.specialty : '') })), existing && existing.doctorName || '', (val) => {
      const d = state.doctors.find(x => x.name === val);
      const specEl = document.getElementById('rf-specialty');
      if (d && specEl) specEl.value = d.specialty || '';
    }, 'Search doctor…');
    document.getElementById('rf-doctor')._ssController = ctrl;
  }
  if (reg.key === 'test' || reg.key === 'homeCollection') {
    const container = document.getElementById('rf-tests-rows');
    const initial = (existing && existing.requestedTests) || [];
    if (initial.length) initial.forEach(name => addTestMultiRow(container, name)); else addTestMultiRow(container, '');
    document.getElementById('rf-add-test').addEventListener('click', () => addTestMultiRow(container, ''));
  }
}
function registerExtraFieldsCollect(reg) {
  if (reg.key === 'doctor' || reg.key === 'dental') {
    const doctorName = document.getElementById('rf-doctor')._ssController.getValue();
    if (!doctorName) return { error: 'Doctor Name is required.' };
    const data = { doctorName, specialty: document.getElementById('rf-specialty').value.trim() };
    if (reg.key === 'dental') {
      const treatmentType = document.getElementById('rf-treatment').value;
      if (!treatmentType) return { error: 'Treatment Type is required.' };
      data.treatmentType = treatmentType;
    }
    return { data };
  }
  if (reg.key === 'test' || reg.key === 'homeCollection') {
    const names = [];
    document.getElementById('rf-tests-rows').querySelectorAll('.multi-row').forEach(row => { const v = row._ssController && row._ssController.getValue(); if (v) names.push(v); });
    if (!names.length) return { error: 'Add at least one requested test.' };
    const data = { requestedTests: names };
    if (reg.key === 'homeCollection') {
      const address = document.getElementById('rf-address').value.trim();
      if (!address) return { error: 'Address is required.' };
      data.address = address;
      data.area = document.getElementById('rf-area').value.trim();
      data.pin = document.getElementById('rf-pin').value.trim();
    }
    return { data };
  }
  return { data: {} };
}

function statusAccent(s) { return { Booked: 'blue', Completed: 'green', Cancelled: 'red', Rescheduled: 'amber' }[s] || 'teal'; }
function startOfMonthISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-01`; }

let reportRowsCache = [];
async function loadAndRenderReport(registerKey, tab, dateFrom, dateTo) {
  const body = document.getElementById('rp-body');
  body.innerHTML = loaderHtml();
  try {
    const rows = await fetchRegisterRows(registerKey, { dateFrom, dateTo });
    reportRowsCache = rows;
    if (tab === 'summary') renderReportSummary(registerKey, rows);
    else renderReportDetail(registerKey, rows);
  } catch (err) {
    console.error(err);
    body.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Could not load report</h4><p>${escapeHtml(err.message || '')}</p></div>`;
  }
}
function renderReportSummary(registerKey, rows) {
  const body = document.getElementById('rp-body');
  const total = rows.length;
  const byStatus = {}; STATUS_OPTIONS.forEach(s => byStatus[s] = 0);
  rows.forEach(r => { const s = r.status || 'Booked'; byStatus[s] = (byStatus[s] || 0) + 1; });
  const bySource = {};
  rows.forEach(r => { const s = r.source || '—'; bySource[s] = (bySource[s] || 0) + 1; });
  if (!total) { body.innerHTML = `<div class="empty-state">${icon('barChart')}<h4>No data in this range</h4><p>Widen the date range to see a summary.</p></div>`; return; }
  body.innerHTML = `
    <div class="card-pad">
      <div class="stat-grid">
        <div class="stat-card accent-ink"><span class="lbl"><span class="stat-icon-badge badge-ink">${icon('calendar')}</span>Total</span><div class="val">${formatInt(total)}</div></div>
        ${STATUS_OPTIONS.map(s => `<div class="stat-card accent-${statusAccent(s)}"><span class="lbl"><span class="stat-icon-badge badge-${statusAccent(s)}">${icon('check')}</span>${s}</span><div class="val">${formatInt(byStatus[s])}</div></div>`).join('')}
      </div>
      <div class="card card-pad" style="max-width:380px;margin:0 auto 24px;"><canvas id="rp-status-chart" height="230"></canvas></div>
      <span class="section-label">By Booking Source</span>
      <div class="table-wrap"><table><thead><tr><th>Source</th><th class="num">Count</th></tr></thead><tbody>
        ${Object.keys(bySource).sort((a, b) => bySource[b] - bySource[a]).map(s => `<tr><td>${escapeHtml(s)}</td><td class="num">${formatInt(bySource[s])}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  `;
  const ctx = document.getElementById('rp-status-chart');
  if (reportChartInstance) { reportChartInstance.destroy(); reportChartInstance = null; }
  if (ctx && window.Chart) {
    reportChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: STATUS_OPTIONS,
        datasets: [{ data: STATUS_OPTIONS.map(s => byStatus[s]), backgroundColor: ['#2E77E0', '#1FAA6D', '#DC2626', '#DE7F1E'], borderWidth: 0 }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 12 }, padding: 14 } } }, cutout: '65%', animation: { animateScale: true, duration: 700 } }
    });
  }
}
function renderReportDetail(registerKey, rows) {
  const reg = REGISTERS[registerKey];
  const body = document.getElementById('rp-body');
  if (!rows.length) { body.innerHTML = `<div class="empty-state">${icon('search')}<h4>No bookings in this range</h4></div>`; return; }
  body.innerHTML = `<table><thead><tr>${reg.listCols.map(c => `<th>${c.h}</th>`).join('')}<th>Status</th><th>Priority</th><th>Source</th><th>Booked By</th></tr></thead>
    <tbody>${rows.map(r => `<tr>${reg.listCols.map(c => `<td>${registerCellValue(reg, r, c.k)}</td>`).join('')}<td><span class="badge st-${(r.status || 'Booked').toLowerCase()}">${escapeHtml(r.status || 'Booked')}</span></td><td><span class="badge pr-${(r.priority || 'Normal').toLowerCase()}">${escapeHtml(r.priority || 'Normal')}</span></td><td>${escapeHtml(r.source || '—')}</td><td>${escapeHtml(r.bookedByName || '—')}</td></tr>`).join('')}</tbody>`;
}
function exportReportToExcel(registerKey, tab, dateFrom, dateTo) {
  if (!reportRowsCache.length) { toast('Nothing to export.', 'error'); return; }
  const reg = REGISTERS[registerKey];
  const header = reg.listCols.map(c => c.h).concat(['Status', 'Priority', 'Source', 'Remarks', 'Booked By', 'Booked On']);
  const body = reportRowsCache.map(r => reg.listCols.map(c => registerCellValueRaw(reg, r, c.k)).concat([r.status || '', r.priority || '', r.source || '', r.remarks || '', r.bookedByName || '', formatDateTimeHuman(r.bookedOn)]));
  const ws = XLSX.utils.aoa_to_sheet([header].concat(body));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, reg.short.slice(0, 28));
  XLSX.writeFile(wb, `${reg.short.replace(/\s+/g, '_')}_Report_${dateFrom}_to_${dateTo}.xlsx`);
}
function registerCellValueRaw(reg, r, key) {
  if (key === 'appointmentDate') return formatDateHuman(r.appointmentDate);
  if (key === 'testsSummary') return (r.requestedTests || []).join(', ');
  return r[key] || '';
}

/* ============================================================
   DASHBOARD
   ============================================================ */
let dashRegisterChart = null, dashStatusChart = null;
function tsToMillis(ts) {
  if (!ts) return 0;
  if (typeof ts.toMillis === 'function') return ts.toMillis();
  if (typeof ts.toDate === 'function') return ts.toDate().getTime();
  const d = new Date(ts); return isNaN(d) ? 0 : d.getTime();
}
function registersVisibleToCurrentUser() {
  if (state.isAgent) return REGISTER_KEYS.filter(k => state.user.permissions && state.user.permissions[k]);
  return REGISTER_KEYS;
}
async function getDashboardData() {
  const registersToShow = registersVisibleToCurrentUser();
  const today = todayISO();
  const weekEnd = addDaysISO(today, 6);
  const perRegister = {};
  await Promise.all(registersToShow.map(async (k) => { perRegister[k] = await fetchRegisterRows(k, { dateFrom: today, dateTo: weekEnd }); }));
  return { registersToShow, perRegister, today };
}
function registerTileHtml(k) {
  const reg = REGISTERS[k];
  return `<button class="register-tile" data-quickadd="${k}" style="border:1px solid var(--line-200);">
    <div class="ico" style="background:linear-gradient(135deg,var(--${reg.accent}-500),var(--${reg.accent}-600));">${icon(reg.icon)}</div>
    <div class="txt"><div class="t">${escapeHtml(reg.label)}</div><div class="s">New booking</div></div>
  </button>`;
}
function recentRowHtml(r) {
  const reg = REGISTERS[r._reg];
  return `<tr style="cursor:pointer;" data-goto="${r._reg}|${r.id}">
    <td><span class="form-section-icon" style="background:var(--${reg.accent}-100);color:var(--${reg.accent}-600);margin-right:8px;">${icon(reg.icon)}</span>${escapeHtml(reg.short)}</td>
    <td style="font-weight:600;">${escapeHtml(r.patientName)}</td>
    <td class="id-cell">${escapeHtml(r.bookingId)}</td>
    <td>${escapeHtml(r.timeSlot || '—')}</td>
    <td><span class="badge st-${(r.status || 'Booked').toLowerCase()}">${escapeHtml(r.status || 'Booked')}</span></td>
  </tr>`;
}
async function renderDashboardView(content) {
  content.innerHTML = loaderHtml();
  let data;
  try { data = await getDashboardData(); } catch (err) { content.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Could not load dashboard</h4></div>`; return; }
  const { registersToShow, perRegister, today } = data;
  const todayRows = {}; let todayTotal = 0, weekTotal = 0;
  const statusToday = {}; STATUS_OPTIONS.forEach(s => statusToday[s] = 0);
  registersToShow.forEach(k => {
    todayRows[k] = perRegister[k].filter(r => r.appointmentDate === today);
    todayTotal += todayRows[k].length;
    weekTotal += perRegister[k].length;
    todayRows[k].forEach(r => { const s = r.status || 'Booked'; statusToday[s] = (statusToday[s] || 0) + 1; });
  });
  let recent = [];
  registersToShow.forEach(k => todayRows[k].forEach(r => recent.push(Object.assign({ _reg: k }, r))));
  recent.sort((a, b) => tsToMillis(b.bookedOn) - tsToMillis(a.bookedOn));
  recent = recent.slice(0, 8);

  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card accent-ink"><span class="lbl"><span class="stat-icon-badge badge-ink">${icon('calendar')}</span>Today's Bookings</span><div class="val" id="dk-today">0</div></div>
      <div class="stat-card accent-teal"><span class="lbl"><span class="stat-icon-badge badge-teal">${icon('barChart')}</span>Next 7 Days</span><div class="val" id="dk-week">0</div></div>
      <div class="stat-card accent-green"><span class="lbl"><span class="stat-icon-badge badge-green">${icon('check')}</span>Completed Today</span><div class="val c-green" id="dk-completed">0</div></div>
      <div class="stat-card accent-red"><span class="lbl"><span class="stat-icon-badge badge-red">${icon('x')}</span>Cancelled Today</span><div class="val" id="dk-cancelled">0</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px;" id="dk-chart-grid">
      <div class="card card-pad"><h3 style="font-family:var(--font-display);font-size:14.5px;margin-bottom:14px;">Today, by Register</h3><canvas id="dk-register-chart" height="200"></canvas></div>
      <div class="card card-pad"><h3 style="font-family:var(--font-display);font-size:14.5px;margin-bottom:14px;">Today, by Status</h3><canvas id="dk-status-chart" height="200"></canvas></div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h3>Recent Activity</h3><span class="u-muted" style="font-size:12px;">Today, most recent first</span></div>
      <div class="table-wrap" style="border:none;border-radius:0;">
        ${recent.length ? `<table><thead><tr><th>Register</th><th>Patient</th><th>ID</th><th>Time</th><th>Status</th></tr></thead><tbody>${recent.map(recentRowHtml).join('')}</tbody></table>`
      : `<div class="empty-state">${icon('calendar')}<h4>No bookings yet today</h4><p>New bookings will appear here as they come in.</p></div>`}
      </div>
    </div>
    <div>
      <span class="section-label">Quick Add</span>
      <div class="stat-grid">${registersToShow.map(registerTileHtml).join('')}</div>
    </div>
  `;
  animateCountUp(document.getElementById('dk-today'), todayTotal);
  animateCountUp(document.getElementById('dk-week'), weekTotal);
  animateCountUp(document.getElementById('dk-completed'), statusToday.Completed || 0);
  animateCountUp(document.getElementById('dk-cancelled'), statusToday.Cancelled || 0);

  if (dashRegisterChart) { dashRegisterChart.destroy(); dashRegisterChart = null; }
  if (dashStatusChart) { dashStatusChart.destroy(); dashStatusChart = null; }
  const regCtx = document.getElementById('dk-register-chart');
  if (regCtx && window.Chart) {
    const accentHex = { teal: '#14948F', blue: '#2E77E0', amber: '#DE7F1E', violet: '#8562C7' };
    dashRegisterChart = new Chart(regCtx, {
      type: 'bar',
      data: { labels: registersToShow.map(k => REGISTERS[k].short), datasets: [{ data: registersToShow.map(k => todayRows[k].length), backgroundColor: registersToShow.map(k => accentHex[REGISTERS[k].accent] || '#14948F'), borderRadius: 8, maxBarThickness: 46 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, animation: { duration: 700 } }
    });
  }
  const stCtx = document.getElementById('dk-status-chart');
  if (stCtx && window.Chart) {
    dashStatusChart = new Chart(stCtx, {
      type: 'doughnut',
      data: { labels: STATUS_OPTIONS, datasets: [{ data: STATUS_OPTIONS.map(s => statusToday[s]), backgroundColor: ['#2E77E0', '#1FAA6D', '#DC2626', '#DE7F1E'], borderWidth: 0 }] },
      options: { plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11.5 }, padding: 12 } } }, cutout: '65%', animation: { animateScale: true, duration: 700 } }
    });
  }
  content.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => { const [rk, id] = el.dataset.goto.split('|'); navigateTo('register-form', { registerKey: rk, id }); }));
  content.querySelectorAll('[data-quickadd]').forEach(el => el.addEventListener('click', () => navigateTo('register-form', { registerKey: el.dataset.quickadd, id: null })));
}

/* ============================================================
   SETTINGS (Admin & Super-Admin-in-branch)
   ============================================================ */
function chipHtml(text, dataAttr) {
  return `<span class="pill active" style="cursor:default;display:inline-flex;align-items:center;gap:7px;">${escapeHtml(text)}<button type="button" data-${dataAttr}="${escapeHtml(text)}" style="background:none;border:none;color:inherit;cursor:pointer;display:flex;padding:0;">${icon('x')}</button></span>`;
}
async function saveSettingsField(key, value) {
  await updateDoc(doc(db, 'branches', state.branchId), { ['settings.' + key]: value });
  state.settings[key] = value;
}
async function changeOwnPassword(curPw, newPw) {
  const cred = EmailAuthProvider.credential(auth.currentUser.email, curPw);
  await reauthenticateWithCredential(auth.currentUser, cred);
  await fbUpdatePassword(auth.currentUser, newPw);
}
async function renderSettingsView(content) {
  const s = state.settings || DEFAULT_SETTINGS;
  let sources = s.bookingSources.slice();
  let treatments = s.dentalTreatmentTypes.slice();
  content.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Clinic Hours &amp; Time Slots</span>
      <p class="hint" style="margin-bottom:12px;">Slot length can differ per register — used to generate the Time Slot picker on the booking form.</p>
      <div class="form-grid">
        <div class="field-wrap"><label>Opens At</label><input type="time" id="st-open" value="${escapeHtml(s.clinicStart)}"></div>
        <div class="field-wrap"><label>Closes At</label><input type="time" id="st-close" value="${escapeHtml(s.clinicEnd)}"></div>
      </div>
      <div class="form-grid cols-3" style="margin-top:14px;">
        ${REGISTER_KEYS.map(k => `<div class="field-wrap"><label>${escapeHtml(REGISTERS[k].short)} Slot (min)</label><input type="number" min="5" step="5" id="st-slot-${k}" value="${s.slotMinutes[k]}"></div>`).join('')}
      </div>
      <button class="btn btn-primary btn-sm" id="st-save-hours" style="margin-top:16px;">${icon('check')}Save</button>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Booking Sources</span>
      <div id="st-sources-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;"></div>
      <div class="u-flex u-gap-8"><input type="text" id="st-new-source" placeholder="Add a source…" style="max-width:220px;"><button class="btn btn-secondary btn-sm" id="st-add-source">${icon('plus')}Add</button></div>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Dental Treatment Types</span>
      <div id="st-treat-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;"></div>
      <div class="u-flex u-gap-8"><input type="text" id="st-new-treat" placeholder="Add a treatment type…" style="max-width:220px;"><button class="btn btn-secondary btn-sm" id="st-add-treat">${icon('plus')}Add</button></div>
    </div>
    <div class="card card-pad" style="max-width:760px;">
      <span class="section-label">Change Password</span>
      <div class="form-grid" style="margin-top:10px;">
        <div class="field-wrap"><label>Current Password</label><input type="password" id="st-cur-pw"></div>
        <div class="field-wrap"><label>New Password</label><input type="password" id="st-new-pw"></div>
      </div>
      <button class="btn btn-secondary btn-sm" id="st-change-pw" style="margin-top:14px;">${icon('lock')}Update Password</button>
    </div>
  `;
  function renderChips() {
    document.getElementById('st-sources-chips').innerHTML = sources.length ? sources.map(x => chipHtml(x, 'rm-src')).join('') : '<span class="u-muted" style="font-size:12.5px;">None yet</span>';
    document.getElementById('st-treat-chips').innerHTML = treatments.length ? treatments.map(x => chipHtml(x, 'rm-treat')).join('') : '<span class="u-muted" style="font-size:12.5px;">None yet</span>';
    document.querySelectorAll('[data-rm-src]').forEach(el => el.addEventListener('click', async () => {
      sources = sources.filter(x => x !== el.dataset.rmSrc);
      try { await saveSettingsField('bookingSources', sources); toast('Updated.', 'success'); } catch (err) { toast(err.message, 'error'); }
      renderChips();
    }));
    document.querySelectorAll('[data-rm-treat]').forEach(el => el.addEventListener('click', async () => {
      treatments = treatments.filter(x => x !== el.dataset.rmTreat);
      try { await saveSettingsField('dentalTreatmentTypes', treatments); toast('Updated.', 'success'); } catch (err) { toast(err.message, 'error'); }
      renderChips();
    }));
  }
  renderChips();
  document.getElementById('st-add-source').addEventListener('click', async () => {
    const input = document.getElementById('st-new-source'); const val = input.value.trim();
    if (!val) return;
    if (sources.includes(val)) { toast('Already exists.', 'error'); return; }
    sources.push(val); input.value = '';
    try { await saveSettingsField('bookingSources', sources); toast('Added.', 'success'); } catch (err) { toast(err.message, 'error'); }
    renderChips();
  });
  document.getElementById('st-add-treat').addEventListener('click', async () => {
    const input = document.getElementById('st-new-treat'); const val = input.value.trim();
    if (!val) return;
    if (treatments.includes(val)) { toast('Already exists.', 'error'); return; }
    treatments.push(val); input.value = '';
    try { await saveSettingsField('dentalTreatmentTypes', treatments); toast('Added.', 'success'); } catch (err) { toast(err.message, 'error'); }
    renderChips();
  });
  document.getElementById('st-save-hours').addEventListener('click', async () => {
    const clinicStart = document.getElementById('st-open').value, clinicEnd = document.getElementById('st-close').value;
    const slotMinutes = {};
    REGISTER_KEYS.forEach(k => { slotMinutes[k] = toNum(document.getElementById('st-slot-' + k).value) || DEFAULT_SETTINGS.slotMinutes[k]; });
    const btn = document.getElementById('st-save-hours');
    setBtnLoading(btn, true, 'Saving…');
    try {
      await updateDoc(doc(db, 'branches', state.branchId), { 'settings.clinicStart': clinicStart, 'settings.clinicEnd': clinicEnd, 'settings.slotMinutes': slotMinutes });
      state.settings.clinicStart = clinicStart; state.settings.clinicEnd = clinicEnd; state.settings.slotMinutes = slotMinutes;
      toast('Clinic hours updated.', 'success');
    } catch (err) { toast(err.message, 'error'); } finally { setBtnLoading(btn, false); }
  });
  document.getElementById('st-change-pw').addEventListener('click', async () => {
    const curPw = document.getElementById('st-cur-pw').value, newPw = document.getElementById('st-new-pw').value;
    if (!curPw || !newPw) { toast('Fill in both fields.', 'error'); return; }
    if (newPw.length < 6) { toast('New password must be at least 6 characters.', 'error'); return; }
    const btn = document.getElementById('st-change-pw');
    setBtnLoading(btn, true, 'Updating…');
    try { await changeOwnPassword(curPw, newPw); toast('Password updated.', 'success'); document.getElementById('st-cur-pw').value = ''; document.getElementById('st-new-pw').value = ''; }
    catch (err) { toast(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? 'Current password is incorrect.' : (err.message || 'Failed.'), 'error'); }
    finally { setBtnLoading(btn, false); }
  });
}
function openMyAccountModal() {
  openModal(`
    <div class="modal-head"><h3>My Account</h3><button class="icon-btn" id="m-x">${icon('x')}</button></div>
    <div class="modal-body">
      <div style="margin-bottom:18px;"><div style="font-size:12.5px;color:var(--slate-500);">Signed in as</div><div style="font-weight:600;font-size:14.5px;">${escapeHtml(state.user.name)}</div><div class="u-muted" style="font-size:12.5px;">${escapeHtml(state.user.email)}</div></div>
      <div class="field-wrap" style="margin-bottom:12px;"><label>Current Password</label><input type="password" id="ma-cur-pw"></div>
      <div class="field-wrap"><label>New Password</label><input type="password" id="ma-new-pw"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="m-cancel">Close</button><button class="btn btn-primary" id="ma-save">${icon('lock')}Update Password</button></div>
  `);
  document.getElementById('m-x').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('ma-save').addEventListener('click', async () => {
    const curPw = document.getElementById('ma-cur-pw').value, newPw = document.getElementById('ma-new-pw').value;
    if (!curPw || !newPw) { toast('Fill in both fields.', 'error'); return; }
    if (newPw.length < 6) { toast('New password must be at least 6 characters.', 'error'); return; }
    const btn = document.getElementById('ma-save');
    setBtnLoading(btn, true, 'Updating…');
    try { await changeOwnPassword(curPw, newPw); toast('Password updated.', 'success'); closeModal(); }
    catch (err) { setBtnLoading(btn, false); toast(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? 'Current password is incorrect.' : (err.message || 'Failed.'), 'error'); }
  });
}

/* ============================================================
   INIT
   ============================================================ */
function wireUserChipClick() {
  const chip = document.querySelector('.user-chip');
  if (chip) { chip.style.cursor = 'pointer'; chip.title = 'My Account · change password'; chip.addEventListener('click', openMyAccountModal); }
}
(function init() {
  if (CONFIG_IS_PLACEHOLDER) { showConfigNeeded(); return; }
  wireAuthListeners();
  wireUserChipClick();
})();

</script>
