function paginationHtml(page, totalPages, totalCount) {
  return `<div class="u-between" style="flex-wrap:wrap;gap:10px;">
    <span class="u-muted" style="font-size:12.5px;">${formatInt(totalCount)} result(s) · Page ${page} of ${totalPages}</span>
    <div class="u-flex u-gap-8"><button class="btn btn-secondary btn-sm" id="pg-prev" ${page <= 1 ? 'disabled' : ''}>${icon('chevronLeft')}Prev</button><button class="btn btn-secondary btn-sm" id="pg-next" ${page >= totalPages ? 'disabled' : ''}>Next${icon('chevronRight')}</button></div>
  </div>`;
}
function renderRegisterTablePage(registerKey) {
  const reg = REGISTERS[registerKey];
  const cache = state.registerCache[registerKey];
  const rows = cache.allRows || [];
  const slot = document.getElementById('rl-table-slot');
  if (!rows.length) {
    slot.innerHTML = `<div class="empty-state">${icon(reg.icon)}<h4>No bookings found</h4><p>Try widening the date range, or clear the search and filters.</p></div>`;
    document.getElementById('rl-pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  cache.page = Math.min(cache.page, totalPages);
  const pageRows = rows.slice((cache.page - 1) * PAGE_SIZE, cache.page * PAGE_SIZE);
  slot.innerHTML = `<table><thead><tr>${reg.listCols.map(c => `<th>${c.h}</th>`).join('')}<th>Status</th><th>Priority</th><th>Booked By</th><th></th></tr></thead><tbody>${pageRows.map(r => registerRowHtml(reg, r)).join('')}</tbody></table>`;
  document.getElementById('rl-pagination').innerHTML = paginationHtml(cache.page, totalPages, rows.length);
  slot.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => navigateTo('register-form', { registerKey, id: el.dataset.open })));
  slot.querySelectorAll('[data-history]').forEach(el => el.addEventListener('click', () => openBookingHistoryModal(registerKey, el.dataset.history, el.dataset.bid)));
  slot.querySelectorAll('[data-quickdel]').forEach(el => el.addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Delete booking?', danger: true, confirmLabel: 'Move to Recycle Bin', message: `Booking <b>${escapeHtml(el.dataset.bid)}</b> will be moved to the recycle bin.` });
    if (!ok) return;
    const row = rows.find(r => r.id === el.dataset.quickdel);
    try { await softDeleteBooking(registerKey, el.dataset.quickdel, row); toast('Moved to recycle bin.', 'success'); loadAndRenderRegisterRows(registerKey); } catch (err) { toast(err.message, 'error'); }
  }));
  slot.querySelectorAll('[data-quickstatus]').forEach(el => el.addEventListener('change', async () => {
    const id = el.dataset.quickstatus;
    let row = rows.find(r => r.id === id);
    const oldStatus = (row && row.status) || 'Booked', newStatus = el.value;
    if (oldStatus === newStatus) return;
    if (newStatus === 'Rescheduled') {
      el.disabled = true;
      if (!row) row = await getBookingDoc(registerKey, id);
      openRescheduleModal(registerKey, row, (didReschedule) => {
        el.disabled = false;
        if (didReschedule) { row.status = 'Rescheduled'; el.className = 'status-select st-rescheduled'; el.value = 'Rescheduled'; loadAndRenderRegisterRows(registerKey); }
        else { el.value = oldStatus; }
      });
      return;
    }
    el.className = 'status-select st-' + newStatus.toLowerCase(); // optimistic — updates the pill color immediately
    el.disabled = true;
    try {
      await updateBookingStatusOnly(registerKey, id, row, newStatus);
      if (row) row.status = newStatus;
      toast(`${(row && row.bookingId) || id} marked ${newStatus}.`, 'success');
    } catch (err) {
      el.value = oldStatus; el.className = 'status-select st-' + oldStatus.toLowerCase();
      toast(err.message || 'Could not update status.', 'error');
    } finally { el.disabled = false; }
  }));
  const prev = document.getElementById('pg-prev'), next = document.getElementById('pg-next');
  if (prev) prev.addEventListener('click', () => { cache.page = Math.max(1, cache.page - 1); renderRegisterTablePage(registerKey); });
  if (next) next.addEventListener('click', () => { cache.page = cache.page + 1; renderRegisterTablePage(registerKey); });
}
/* ============================================================
   IMPORT — template download + upload, for every register and for masters
   ============================================================ */
function readFileAsRows(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, { defval: '' }));
      } catch (err) { reject(new Error("Could not read that file — make sure it's a .xlsx file.")); }
    };
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.readAsArrayBuffer(file);
  });
}
function downloadRegisterTemplate(registerKey) {
  const reg = REGISTERS[registerKey];
  const ws = XLSX.utils.aoa_to_sheet([reg.importCols.map(c => c.h), reg.importCols.map(c => c.sample || '')]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, `${reg.short.replace(/\s+/g, '_')}_Import_Template.xlsx`);
}
function downloadMasterImportTemplate(kind) {
  const isDoctors = kind === 'doctors';
  const ws = XLSX.utils.aoa_to_sheet([isDoctors ? ['Name', 'Specialty'] : ['Name'], isDoctors ? ['Dr. Kabir Hossain', 'Cardiology'] : ['CBC']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, `${isDoctors ? 'Doctors' : 'Tests'}_Import_Template.xlsx`);
}
function parseRegisterImportRows(registerKey, rawRows) {
  const reg = REGISTERS[registerKey];
  const valid = [], invalid = [];
  rawRows.forEach((raw, i) => {
    const data = {}, errors = [];
    reg.importCols.forEach((c) => {
      let v = raw[c.h]; v = (v === undefined || v === null) ? '' : String(v).trim();
      if (c.req && !v) errors.push(`${c.h} is required`);
      data[c.k] = v;
    });
    if (data.appointmentDate && !/^\d{4}-\d{2}-\d{2}$/.test(data.appointmentDate)) {
      const d = new Date(data.appointmentDate);
      if (!isNaN(d)) data.appointmentDate = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      else errors.push('Appointment Date must look like YYYY-MM-DD');
    }
    if (data.mobileNumber) { data.mobileNumber = normalizeMobile(data.mobileNumber); if (!validateMobile(data.mobileNumber)) errors.push('Mobile Number looks invalid'); }
    if (!PRIORITY_OPTIONS.includes(data.priority)) data.priority = 'Normal';
    if ('requestedTests' in data) data.requestedTests = data.requestedTests ? data.requestedTests.split(',').map(t => t.trim()).filter(Boolean) : [];
    if (errors.length) invalid.push({ row: i + 2, errors }); else valid.push(data);
  });
  return { valid, invalid };
}
function parseMasterImportRows(kind, rawRows) {
  const isDoctors = kind === 'doctors';
  const valid = [], invalid = [];
  rawRows.forEach((raw, i) => {
    const name = String(raw['Name'] || '').trim();
    if (!name) { invalid.push({ row: i + 2, errors: ['Name is required'] }); return; }
    valid.push(isDoctors ? { name, specialty: String(raw['Specialty'] || '').trim() } : { name });
  });
  return { valid, invalid };
}
async function reserveBookingIdBlock(registerKey, count) {
  const counterRef = doc(db, 'clinics', state.clinicId, 'counters', registerKey);
  const startSeq = await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? snap.data().seq : 0;
    tx.set(counterRef, { seq: current + count }, { merge: true });
    return current + 1;
  });
  const ids = [];
  for (let i = 0; i < count; i++) ids.push(`${REGISTERS[registerKey].idPrefix}-${String(startSeq + i).padStart(6, '0')}`);
  return ids;
}
async function bulkCreateBookings(registerKey, rowsData) {
  if (!rowsData.length) return 0;
  const ids = await reserveBookingIdBlock(registerKey, rowsData.length);
  const colRef = collection(db, 'clinics', state.clinicId, REGISTERS[registerKey].collection);
  const dsDelta = {}, monthDelta = {};
  const docsToWrite = rowsData.map((data, i) => {
    const payload = Object.assign({}, data, {
      bookingId: ids[i], patientNameLower: (data.patientName || '').toLowerCase(), status: 'Booked', deleted: false,
      bookedBy: state.user.uid, bookedByName: state.user.name, bookedOn: serverTimestamp(), createdAt: serverTimestamp(), imported: true
    });
    dsDelta[`${registerKey}_total`] = (dsDelta[`${registerKey}_total`] || 0) + 1;
    dsDelta[`${registerKey}_Booked`] = (dsDelta[`${registerKey}_Booked`] || 0) + 1;
    if (data.appointmentDate) {
      const mk = data.appointmentDate.slice(0, 7);
      if (!monthDelta[mk]) monthDelta[mk] = {};
      monthDelta[mk].total = (monthDelta[mk].total || 0) + 1;
      monthDelta[mk].Booked = (monthDelta[mk].Booked || 0) + 1;
    }
    return { ref: doc(colRef), payload };
  });
  for (let i = 0; i < docsToWrite.length; i += 400) {
    const chunk = docsToWrite.slice(i, i + 400);
    const batch = writeBatch(db);
    chunk.forEach(({ ref, payload }) => batch.set(ref, payload));
    if (i === 0) {
      const dsPatch = {};
      Object.keys(dsDelta).forEach(k => { if (dsDelta[k]) dsPatch[k] = increment(dsDelta[k]); });
      if (Object.keys(dsPatch).length) { dsPatch.updatedAt = serverTimestamp(); batch.set(doc(db, 'clinics', state.clinicId, 'meta', 'dashboardSummary'), dsPatch, { merge: true }); }
      Object.keys(monthDelta).forEach((mk) => {
        const d = monthDelta[mk], patch = { registerKey, monthKey: mk, updatedAt: serverTimestamp() };
        let has = false;
        Object.keys(d).forEach(k => { if (d[k]) { patch[k] = increment(d[k]); has = true; } });
        if (has) batch.set(doc(db, 'clinics', state.clinicId, 'monthlySummaries', `${registerKey}_${mk}`), patch, { merge: true });
      });
    }
    await batch.commit();
  }
  return docsToWrite.length;
}
async function bulkImportMasters(kind, rowsData) {
  const existing = kind === 'doctors' ? state.doctors : state.tests;
  const byNameLower = new Map(existing.map(x => [x.name.toLowerCase(), x]));
  const colRef = collection(db, 'clinics', state.clinicId, kind);
  for (let i = 0; i < rowsData.length; i += 450) {
    const batch = writeBatch(db);
    rowsData.slice(i, i + 450).forEach((data) => {
      const match = byNameLower.get(data.name.toLowerCase());
      batch.set(match ? doc(colRef, match.id) : doc(colRef), data, { merge: true });
    });
    await batch.commit();
  }
  const snap = await getDocs(colRef);
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  if (kind === 'doctors') state.doctors = list; else state.tests = list;
  return rowsData.length;
}

/* ---- Shared import modal shell — download-template / drop-file / preview / import ---- */
function openGenericImportModal({ title, onDownloadTemplate, onParse, onImport }) {
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="icon-btn" id="m-x">${icon('x')}</button></div>
    <div class="modal-body">
      <button class="btn btn-secondary btn-sm" id="im-template" style="margin-bottom:16px;">${icon('download')}Download Template</button>
      <div class="file-drop" id="im-drop">${icon('upload')}<div style="font-size:13px;font-weight:600;margin-top:4px;">Click to choose a filled-in template</div><div class="hint">.xlsx, matching the downloaded template's columns</div><div class="fname" id="im-fname"></div></div>
      <input type="file" id="im-file" accept=".xlsx,.xls" class="hidden">
      <div id="im-preview"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="m-cancel">Cancel</button><button class="btn btn-primary hidden" id="im-run">${icon('upload')}Import</button></div>
  `, { wide: true });
  document.getElementById('m-x').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('im-template').addEventListener('click', async () => {
    const btn = document.getElementById('im-template');
    setBtnLoading(btn, true, 'Preparing…');
    try { await loadScriptOnce(XLSX_CDN); onDownloadTemplate(); } catch (err) { toast(err.message, 'error'); } finally { setBtnLoading(btn, false); }
  });
  let parsedValid = [];
  const dropEl = document.getElementById('im-drop'), fileInput = document.getElementById('im-file');
  dropEl.addEventListener('click', () => fileInput.click());
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('drag'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
  dropEl.addEventListener('drop', (e) => { e.preventDefault(); dropEl.classList.remove('drag'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
  async function handleFile(file) {
    document.getElementById('im-fname').textContent = file.name;
    const preview = document.getElementById('im-preview');
    preview.innerHTML = loaderHtml();
    document.getElementById('im-run').classList.add('hidden');
    try {
      await loadScriptOnce(XLSX_CDN);
      const rawRows = await readFileAsRows(file);
      const { valid, invalid } = onParse(rawRows);
      parsedValid = valid;
      preview.innerHTML = `
        <div class="u-flex u-gap-12" style="margin:14px 0;">
          <span class="badge active">${valid.length} ready to import</span>
          ${invalid.length ? `<span class="badge inactive">${invalid.length} skipped</span>` : ''}
        </div>
        ${invalid.length ? `<div class="table-wrap" style="max-height:180px;overflow-y:auto;"><table><thead><tr><th>Row</th><th>Issue</th></tr></thead><tbody>${invalid.slice(0, 30).map(x => `<tr><td>${x.row}</td><td>${escapeHtml(x.errors.join('; '))}</td></tr>`).join('')}</tbody></table></div>` : ''}
      `;
      document.getElementById('im-run').classList.toggle('hidden', !valid.length);
    } catch (err) { preview.innerHTML = `<p style="color:var(--red-600);font-size:13px;">${escapeHtml(err.message)}</p>`; }
  }
  document.getElementById('im-run').addEventListener('click', async () => {
    const btn = document.getElementById('im-run');
    setBtnLoading(btn, true, 'Importing…');
    try { const n = await onImport(parsedValid); closeModal(); toast(`${n} record(s) imported.`, 'success'); }
    catch (err) { setBtnLoading(btn, false); toast(err.message || 'Import failed.', 'error'); }
  });
}
function openImportModal(registerKey) {
  openGenericImportModal({
    title: `Import ${REGISTERS[registerKey].label}`,
    onDownloadTemplate: () => downloadRegisterTemplate(registerKey),
    onParse: (rawRows) => parseRegisterImportRows(registerKey, rawRows),
    onImport: async (rows) => { const n = await bulkCreateBookings(registerKey, rows); navigateTo(registerKey); return n; }
  });
}
function openMasterImportModal(kind) {
  openGenericImportModal({
    title: `Import ${kind === 'doctors' ? 'Doctors' : 'Tests'}`,
    onDownloadTemplate: () => downloadMasterImportTemplate(kind),
    onParse: (rawRows) => parseMasterImportRows(kind, rawRows),
    onImport: async (rows) => { const n = await bulkImportMasters(kind, rows); navigateTo('masters', { tab: kind }); return n; }
  });
}

/* ---------- Shared styled-sheet builder for both register & report exports ---------- */
const STATUS_XLSX_COLORS = {
  Booked: { bg: 'DCE9FC', font: '1D5FBF' },
  Completed: { bg: 'DEF3E8', font: '178A56' },
  Cancelled: { bg: 'FBE0E0', font: 'C41F1F' },
  Rescheduled: { bg: 'FBEAD4', font: 'B5620D' }
};
const PRIORITY_XLSX_COLORS = { Urgent: { bg: 'FBEAD4', font: 'B5620D' }, VIP: { bg: 'EDE7F9', font: '6D4AAE' } };
function tsToJsDateOrBlank(input) {
  if (!input) return '';
  if (typeof input.toDate === 'function') { const d = input.toDate(); return isNaN(d) ? '' : d; }
  const d = new Date(input);
  return isNaN(d) ? '' : d;
}
function buildStyledBookingSheet(reg, rows) {
  const headerCols = reg.listCols.map(c => c.h).concat(['Status', 'Priority', 'Source', 'Remarks', 'Booked By', 'Booked On']);
  const dateColIdx = reg.listCols.findIndex(c => c.k === 'appointmentDate');
  const statusColIdx = reg.listCols.length;
  const priorityColIdx = reg.listCols.length + 1;
  const bookedOnColIdx = reg.listCols.length + 5;

  const aoa = [headerCols];
  rows.forEach((r) => {
    const rowArr = reg.listCols.map((c) => {
      if (c.k === 'appointmentDate') return r.appointmentDate ? new Date(r.appointmentDate + 'T00:00:00') : '';
      if (c.k === 'testsSummary') return (r.requestedTests || []).join(', ');
      return r[c.k] || '';
    }).concat([r.status || 'Booked', r.priority || 'Normal', r.source || '', r.remarks || '', r.bookedByName || '', tsToJsDateOrBlank(r.bookedOn)]);
    aoa.push(rowArr);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = headerCols.map((h, i) => ({ wch: Math.max(h.length + 3, i === 0 ? 13 : 14) }));
  try { ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 0, c: headerCols.length - 1 } }) }; } catch (e) { /* non-critical */ }

  // Header row: bold white text on teal
  for (let c = 0; c < headerCols.length; c++) {
    const addr = XLSX.utils.encode_cell({ r: 0, c });
    if (ws[addr]) ws[addr].s = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0E7C7B' } }, alignment: { vertical: 'center' } };
  }
  // Per-row: real date formats + status/priority colour coding, matching the app's own badge colors
  for (let r = 1; r <= rows.length; r++) {
    const rowData = rows[r - 1];
    if (dateColIdx >= 0) { const addr = XLSX.utils.encode_cell({ r, c: dateColIdx }); if (ws[addr] && ws[addr].v) ws[addr].z = 'dd-mmm-yyyy'; }
    const bAddr = XLSX.utils.encode_cell({ r, c: bookedOnColIdx }); if (ws[bAddr] && ws[bAddr].v) ws[bAddr].z = 'dd-mmm-yyyy hh:mm AM/PM';
    const sc = STATUS_XLSX_COLORS[rowData.status || 'Booked'];
    if (sc) { const addr = XLSX.utils.encode_cell({ r, c: statusColIdx }); if (ws[addr]) ws[addr].s = { font: { bold: true, color: { rgb: sc.font } }, fill: { fgColor: { rgb: sc.bg } }, alignment: { horizontal: 'center' } }; }
    const pc = PRIORITY_XLSX_COLORS[rowData.priority];
    if (pc) { const addr = XLSX.utils.encode_cell({ r, c: priorityColIdx }); if (ws[addr]) ws[addr].s = { font: { bold: true, color: { rgb: pc.font } }, fill: { fgColor: { rgb: pc.bg } }, alignment: { horizontal: 'center' } }; }
  }
  return ws;
}
async function exportRegisterToExcel(registerKey) {
  const reg = REGISTERS[registerKey];
  const cache = state.registerCache[registerKey];
  const rows = cache.allRows || [];
  if (!rows.length) { toast('Nothing to export.', 'error'); return; }
  try { await loadScriptOnce(XLSX_CDN); } catch (err) { toast(err.message, 'error'); return; }
  const ws = buildStyledBookingSheet(reg, rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, reg.short.slice(0, 28));
  XLSX.writeFile(wb, `${reg.short.replace(/\s+/g, '_')}_Bookings_${todayISO()}.xlsx`);
}

function registerExtraFieldsCollect(reg) {

    document.getElementById('rf-tests-rows').querySelectorAll('.multi-row').forEach(row => { const v = row._ssController && row._ssController.getValue(); if (v) names.push(v); });

      data.address = address;
      data.area = document.getElementById('rf-area').value.trim();

    }
    return { data };
  }

}

/* ---------- Reschedule: keep the old entry on its original date, spin off a new Booked one ---------- */
async function openRescheduleModal(registerKey, oldRow, onDone) {
  if (!oldRow) { toast('Could not load this booking.', 'error'); onDone(false); return; }
  const reg = REGISTERS[registerKey];
  openModal(`
    <div class="modal-head"><h3>Reschedule ${escapeHtml(oldRow.bookingId)}</h3><button class="icon-btn" id="m-x">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:16px;"><b>${escapeHtml(oldRow.bookingId)}</b> stays on ${escapeHtml(formatDateHuman(oldRow.appointmentDate))} marked Rescheduled. A new Booked entry is created for the new date below.</p>
      <div class="form-grid">
        <div class="field-wrap"><label>New Appointment Date <span class="req">*</span></label><input type="date" id="rs-date" value="${oldRow.appointmentDate}"></div>
        <div class="field-wrap"><label>New Time Slot <span class="req">*</span></label><div class="search-select" id="rs-timeslot"></div></div>
      </div>
      <div class="field-wrap" style="margin-top:14px;"><label>Remarks</label><textarea id="rs-remarks">${escapeHtml(oldRow.remarks || '')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="m-cancel">Cancel</button><button class="btn btn-primary" id="rs-save">${icon('check')}Reschedule</button></div>
  `);
  const cancel = () => { closeModal(); onDone(false); };
  document.getElementById('m-x').addEventListener('click', cancel);
  document.getElementById('m-cancel').addEventListener('click', cancel);
  const slots = generateTimeSlots(reg.slotKey);
  const tsCtrl = initSearchSelect('rs-timeslot', slots.map(s => ({ value: s, label: s })), oldRow.timeSlot || '', null, 'Search or type a time…', true);
  document.getElementById('rs-save').addEventListener('click', async () => {
    const newDate = document.getElementById('rs-date').value;
    const newTimeSlot = tsCtrl.getValue();
    const newRemarks = document.getElementById('rs-remarks').value.trim();
    if (!newDate) { toast('Pick the new appointment date.', 'error'); return; }
    if (!newTimeSlot) { toast('Pick or type the new time slot.', 'error'); return; }
    const btn = document.getElementById('rs-save');
    setBtnLoading(btn, true, 'Rescheduling…');
    try {
      const newData = {
        appointmentDate: newDate, timeSlot: newTimeSlot, patientName: oldRow.patientName, mobileNumber: oldRow.mobileNumber,
        priority: oldRow.priority || 'Normal', source: oldRow.source, status: 'Booked', remarks: newRemarks
      };
      if (reg.key === 'doctor' || reg.key === 'dental') {
        newData.doctorName = oldRow.doctorName; newData.specialty = oldRow.specialty;
        if (reg.key === 'dental') newData.treatmentType = oldRow.treatmentType;
      }
      if (reg.key === 'test' || reg.key === 'homeCollection') {
        newData.requestedTests = oldRow.requestedTests || [];
        if (reg.key === 'homeCollection') { newData.address = oldRow.address; newData.area = oldRow.area; newData.pin = oldRow.pin; }
      }
      // Create the replacement booking FIRST, then mark the old one Rescheduled. If
      // something fails partway through, the worst case is a duplicate "Booked" entry —
      // visible and easy to spot — rather than the old entry vanishing into "Rescheduled"
      // with no replacement ever created.
      const created = await createBooking(registerKey, newData, { bookingDocId: oldRow.id, bookingId: oldRow.bookingId });
      await updateBookingStatusOnly(registerKey, oldRow.id, oldRow, 'Rescheduled', { bookingDocId: created.id, bookingId: created.bookingId });
      closeModal();
      toast(`Rescheduled — new booking ${created.bookingId} created for ${formatDateHuman(newDate)}.`, 'success');
      onDone(true);
    } catch (err) { setBtnLoading(btn, false); toast(err.message || 'Reschedule failed.', 'error'); }
  });
}

  if (existing) document.getElementById('rf-history-btn').addEventListener('click', () => openBookingHistoryModal(registerKey, existing.id, existing.bookingId));
  document.getElementById('rf-save').addEventListener('click', async () => {
    const appointmentDate = document.getElementById('rf-date').value;
    const timeSlot = timeSlotCtrl.getValue();
    const patientName = document.getElementById('rf-patient').value.trim();
    const mobileNumber = normalizeMobile(document.getElementById('rf-mobile').value);
    const priority = document.getElementById('rf-priority').value;
    const source = document.getElementById('rf-source').value;
    const remarks = document.getElementById('rf-remarks').value.trim();
    const status = existing ? document.getElementById('rf-status').value : 'Booked';
    if (!appointmentDate) { toast('Appointment Date is required.', 'error'); return; }
    if (!timeSlot) { toast('Time Slot is required.', 'error'); return; }
    if (!patientName) { toast('Patient Name is required.', 'error'); return; }
    if (!validateMobile(mobileNumber)) { toast('Enter a valid mobile number.', 'error'); return; }
    if (!source) { toast('Booking Source is required.', 'error'); return; }
    const extra = registerExtraFieldsCollect(reg);
    if (extra.error) { toast(extra.error, 'error'); return; }
    const payload = Object.assign({ appointmentDate, timeSlot, patientName, mobileNumber, priority, source, status, remarks }, extra.data);
    const btn = document.getElementById('rf-save');

    // Rescheduling is a workflow (keep the old entry, spin off a new Booked one), not a
    // plain status value — picking it here must behave exactly like picking it from the
    // list view's quick-status dropdown, instead of silently saving status="Rescheduled"
    // with no replacement booking ever created.
    if (existing && status === 'Rescheduled' && existing.status !== 'Rescheduled') {
      setBtnLoading(btn, true, 'Saving…');
      try {
        const preRescheduleData = Object.assign({}, payload, { status: existing.status });
        await updateBooking(registerKey, existing.id, preRescheduleData, existing);
        const freshRow = Object.assign({}, existing, preRescheduleData, { id: existing.id });
        setBtnLoading(btn, false);
        openRescheduleModal(registerKey, freshRow, (didReschedule) => { if (didReschedule) navigateTo(registerKey); });
      } catch (err) { setBtnLoading(btn, false); toast(err.message || 'Save failed.', 'error'); }
      return;
    }

    setBtnLoading(btn, true, existing ? 'Saving…' : 'Creating…');
    try {
      if (existing) { await updateBooking(registerKey, existing.id, payload, existing); showSaveFlash('Booking Updated'); }
      else { const created = await createBooking(registerKey, payload); showSaveFlash('Booking Created · ' + created.bookingId); }
      setTimeout(() => navigateTo(registerKey), 650);
    } catch (err) { setBtnLoading(btn, false); toast(err.message || 'Save failed.', 'error'); }
  });
}

  let data;
  try { data = await getDashboardData(); } catch (err) { content.innerHTML = `<div class="empty-state">${icon('alertTriangle')}<h4>Could not load dashboard</h4></div>`; return; }
  const { registersToShow, perRegister, today, summary } = data;
  const allTimeTotal = registersToShow.reduce((sum, k) => sum + (summary[`${k}_total`] || 0), 0);
  const todayRows = {}, next7Rows = {}; let todayTotal = 0, weekTotal = 0;
  const statusToday = {}; STATUS_OPTIONS.forEach(s => statusToday[s] = 0);
  registersToShow.forEach(k => {
    todayRows[k] = perRegister[k].filter(r => r.appointmentDate === today);
    next7Rows[k] = perRegister[k].filter(r => r.appointmentDate > today);
    todayTotal += todayRows[k].length;
    weekTotal += next7Rows[k].length;
    todayRows[k].forEach(r => { const s = r.status || 'Booked'; statusToday[s] = (statusToday[s] || 0) + 1; });
  });
  let recent = [];
  registersToShow.forEach(k => todayRows[k].forEach(r => recent.push(Object.assign({ _reg: k }, r))));
  recent.sort((a, b) => tsToMillis(b.bookedOn) - tsToMillis(a.bookedOn));
  recent = recent.slice(0, 8);

  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card accent-ink"><span class="lbl"><span class="stat-icon-badge badge-ink">${icon('calendar')}</span>Today's Bookings</span><div class="val" id="dk-today">0</div></div>
      <div class="stat-card accent-green"><span class="lbl"><span class="stat-icon-badge badge-green">${icon('check')}</span>Completed Today</span><div class="val c-green" id="dk-completed">0</div></div>
      <div class="stat-card accent-red"><span class="lbl"><span class="stat-icon-badge badge-red">${icon('x')}</span>Cancelled Today</span><div class="val" id="dk-cancelled">0</div></div>
      <div class="stat-card accent-teal"><span class="lbl"><span class="stat-icon-badge badge-teal">${icon('barChart')}</span>Next 7 Days</span><div class="val" id="dk-week">0</div></div>
      <div class="stat-card accent-violet"><span class="lbl"><span class="stat-icon-badge badge-violet">${icon('star')}</span>All-Time Bookings</span><div class="val" id="dk-alltime">0</div></div>
    </div>
    <div class="dash-chart-grid" id="dk-chart-grid">
      <div class="card card-pad"><h3 style="font-family:var(--font-display);font-size:14.5px;margin-bottom:14px;">Today, by Register</h3><div style="position:relative;height:230px;" id="dk-register-chart-wrap"><canvas id="dk-register-chart"></canvas></div></div>
      <div class="card card-pad"><h3 style="font-family:var(--font-display);font-size:14.5px;margin-bottom:14px;">Today, by Status</h3><div style="position:relative;height:230px;" id="dk-status-chart-wrap"><canvas id="dk-status-chart"></canvas></div></div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-head"><h3>Recent Activity</h3><span class="u-muted" style="font-size:12px;">Today, most recent first</span></div>
      <div class="table-wrap" style="border:none;border-radius:0;">
        ${recent.length ? `<table><thead><tr><th>Register</th><th>Patient</th><th>ID</th><th>Time</th><th>Status</th></tr></thead><tbody>${recent.map(recentRowHtml).join('')}</tbody></table>`
      : `<div class="empty-state">${icon('calendar')}<h4>No bookings yet today</h4><p>New bookings will appear here as they come in.</p></div>`}
      </div>
    </div>
    <div>
      <span class="section-label">Quick Add</span>
      <div class="stat-grid">${registersToShow.map(registerTileHtml).join('')}</div>
    </div>
  `;
  animateCountUp(document.getElementById('dk-today'), todayTotal);
  animateCountUp(document.getElementById('dk-week'), weekTotal);
  animateCountUp(document.getElementById('dk-completed'), statusToday.Completed || 0);
  animateCountUp(document.getElementById('dk-cancelled'), statusToday.Cancelled || 0);
  animateCountUp(document.getElementById('dk-alltime'), allTimeTotal);

  // Wire every interactive element FIRST, before touching charts — a chart failing to
  // render (e.g. the library failing to load) must never be able to leave Quick Add or
  // Recent Activity unresponsive.
  content.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => { const [rk, id] = el.dataset.goto.split('|'); navigateTo('register-form', { registerKey: rk, id }); }));
  content.querySelectorAll('[data-quickadd]').forEach(el => el.addEventListener('click', () => navigateTo('register-form', { registerKey: el.dataset.quickadd, id: null })));

  if (dashRegisterChart) { dashRegisterChart.destroy(); dashRegisterChart = null; }
  if (dashStatusChart) { dashStatusChart.destroy(); dashStatusChart = null; }
  async function drawDashChart(kind) {
    const isReg = kind === 'register';
    const wrap = document.getElementById(isReg ? 'dk-register-chart-wrap' : 'dk-status-chart-wrap');
    if (!wrap) return;
    const canvasId = isReg ? 'dk-register-chart' : 'dk-status-chart';
    try {
      await loadScriptOnce(CHARTJS_CDN);
      if (!document.body.contains(wrap)) return; // navigated away while the chart library was loading
      if (!window.Chart) throw new Error('Chart library did not load.');
      wrap.innerHTML = `<canvas id="${canvasId}"></canvas>`; // fresh canvas in case this is a retry after a failure
      const ctx = document.getElementById(canvasId);
      if (isReg) {
        const accentHex = { teal: '#14948F', blue: '#2E77E0', amber: '#DE7F1E', violet: '#8562C7' };
        dashRegisterChart = new Chart(ctx, {
          type: 'bar',
          data: { labels: registersToShow.map(k => REGISTERS[k].short), datasets: [{ data: registersToShow.map(k => todayRows[k].length), backgroundColor: registersToShow.map(k => accentHex[REGISTERS[k].accent] || '#14948F'), borderRadius: 8, maxBarThickness: 46 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, animation: { duration: 700 } }
        });
      } else {
        dashStatusChart = new Chart(ctx, {
          type: 'doughnut',
          data: { labels: STATUS_OPTIONS, datasets: [{ data: STATUS_OPTIONS.map(s => statusToday[s]), backgroundColor: ['#2E77E0', '#1FAA6D', '#DC2626', '#DE7F1E'], borderWidth: 0 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11.5 }, padding: 12 } } }, cutout: '65%', animation: { animateScale: true, duration: 700 } }
        });
      }
    } catch (err) {
      console.warn(`${kind} chart could not render:`, err);
      if (!document.body.contains(wrap)) return;
      wrap.innerHTML = `<div class="u-center" style="flex-direction:column;height:100%;color:var(--slate-500);text-align:center;padding:0 16px;">
        ${icon('alertTriangle')}<p style="font-size:12.5px;margin:10px 0 12px;">Couldn't load this chart.<br>${escapeHtml((err && err.message) || 'Please check your connection.')}</p>
        <button type="button" class="btn btn-secondary btn-sm" data-retry-chart="${kind}">${icon('refresh')}Retry</button>
      </div>`;
      const retryBtn = wrap.querySelector('[data-retry-chart]');
      if (retryBtn) retryBtn.addEventListener('click', () => drawDashChart(kind));
    }
  }
  drawDashChart('register');
  drawDashChart('status');
}

/* ============================================================
   SETTINGS (Admin & Super-Admin-in-clinic)
   ============================================================ */
function chipHtml(text, dataAttr) {
  return `<span class="pill active" style="cursor:default;display:inline-flex;align-items:center;gap:7px;">${escapeHtml(text)}<button type="button" data-${dataAttr}="${escapeHtml(text)}" style="background:none;border:none;color:inherit;cursor:pointer;display:flex;padding:0;">${icon('x')}</button></span>`;
}
async function saveSettingsField(key, value) {
  await updateDoc(doc(db, 'clinics', state.clinicId), { ['settings.' + key]: value });
  state.settings[key] = value;
}
async function changeOwnPassword(curPw, newPw) {
  const cred = EmailAuthProvider.credential(auth.currentUser.email, curPw);
  await reauthenticateWithCredential(auth.currentUser, cred);
  await fbUpdatePassword(auth.currentUser, newPw);
}
async function renderSettingsView(content) {
  const s = state.settings || DEFAULT_SETTINGS;
  let sources = s.bookingSources.slice();
  let treatments = s.dentalTreatmentTypes.slice();
  content.innerHTML = `
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Clinic Hours &amp; Time Slots</span>
      <p class="hint" style="margin-bottom:12px;">Slot length can differ per register — used to generate the Time Slot picker on the booking form.</p>
      <div class="form-grid">
        <div class="field-wrap"><label>Opens At</label><input type="time" id="st-open" value="${escapeHtml(s.clinicStart)}"></div>
        <div class="field-wrap"><label>Closes At</label><input type="time" id="st-close" value="${escapeHtml(s.clinicEnd)}"></div>
      </div>
      <div class="form-grid cols-3" style="margin-top:14px;">
        ${REGISTER_KEYS.map(k => `<div class="field-wrap"><label>${escapeHtml(REGISTERS[k].short)} Slot (min)</label><input type="number" min="5" step="5" id="st-slot-${k}" value="${s.slotMinutes[k]}"></div>`).join('')}
      </div>
      <button class="btn btn-primary btn-sm" id="st-save-hours" style="margin-top:16px;">${icon('check')}Save</button>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Booking Sources</span>
      <div id="st-sources-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;"></div>
      <div class="u-flex u-gap-8"><input type="text" id="st-new-source" placeholder="Add a source…" style="max-width:220px;"><button class="btn btn-secondary btn-sm" id="st-add-source">${icon('plus')}Add</button></div>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Dental Treatment Types</span>
      <div id="st-treat-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;"></div>
      <div class="u-flex u-gap-8"><input type="text" id="st-new-treat" placeholder="Add a treatment type…" style="max-width:220px;"><button class="btn btn-secondary btn-sm" id="st-add-treat">${icon('plus')}Add</button></div>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;max-width:760px;">
      <span class="section-label">Data &amp; Performance</span>
      <p class="hint" style="margin-bottom:12px;">Dashboard and Report summaries update automatically as bookings are created, edited or deleted. If numbers ever look off — e.g. after data was edited directly in the Firebase console — recalculate them from scratch here.</p>
      <button class="btn btn-secondary btn-sm" id="st-recalc">${icon('refresh')}Recalculate Summary</button>
    </div>
    <div class="card card-pad" style="max-width:760px;">
      <span class="section-label">Change Password</span>
      <div class="form-grid" style="margin-top:10px;">
        <div class="field-wrap"><label>Current Password</label><input type="password" id="st-cur-pw"></div>
        <div class="field-wrap"><label>New Password</label><input type="password" id="st-new-pw"></div>
      </div>
      <button class="btn btn-secondary btn-sm" id="st-change-pw" style="margin-top:14px;">${icon('lock')}Update Password</button>
    </div>
  `;
  document.getElementById('st-recalc').addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Recalculate summary?', confirmLabel: 'Recalculate', message: 'This re-reads every booking in this clinic once and rebuilds the dashboard and report totals from scratch. Takes a few seconds for a lot of data; everything else keeps working normally while it runs.' });
    if (!ok) return;
    const btn = document.getElementById('st-recalc');
    setBtnLoading(btn, true, 'Recalculating…');
    try { const r = await reconcileClinicSummary(state.clinicId); toast(`Summary rebuilt across ${r.months} month(s).`, 'success'); }
    catch (err) { toast(err.message || 'Recalculate failed.', 'error'); }
    finally { setBtnLoading(btn, false); }
  });
  function renderChips() {
    document.getElementById('st-sources-chips').innerHTML = sources.length ? sources.map(x => chipHtml(x, 'rm-src')).join('') : '<span class="u-muted" style="font-size:12.5px;">None yet</span>';
    document.getElementById('st-treat-chips').innerHTML = treatments.length ? treatments.map(x => chipHtml(x, 'rm-treat')).join('') : '<span class="u-muted" style="font-size:12.5px;">None yet</span>';
    document.querySelectorAll('[data-rm-src]').forEach(el => el.addEventListener('click', async () => {
      sources = sources.filter(x => x !== el.dataset.rmSrc);
      try { await saveSettingsField('bookingSources', sources); toast('Updated.', 'success'); } catch (err) { toast(err.message, 'error'); }
      renderChips();
    }));
    document.querySelectorAll('[data-rm-treat]').forEach(el => el.addEventListener('click', async () => {
      treatments = treatments.filter(x => x !== el.dataset.rmTreat);
      try { await saveSettingsField('dentalTreatmentTypes', treatments); toast('Updated.', 'success'); } catch (err) { toast(err.message, 'error'); }
      renderChips();
    }));
  }
  renderChips();
  document.getElementById('st-add-source').addEventListener('click', async () => {
    const input = document.getElementById('st-new-source'); const val = input.value.trim();
    if (!val) return;
    if (sources.includes(val)) { toast('Already exists.', 'error'); return; }
    sources.push(val); input.value = '';
    try { await saveSettingsField('bookingSources', sources); toast('Added.', 'success'); } catch (err) { toast(err.message, 'error'); }
    renderChips();
  });
  document.getElementById('st-add-treat').addEventListener('click', async () => {
    const input = document.getElementById('st-new-treat'); const val = input.value.trim();
    if (!val) return;
    if (treatments.includes(val)) { toast('Already exists.', 'error'); return; }
    treatments.push(val); input.value = '';
    try { await saveSettingsField('dentalTreatmentTypes', treatments); toast('Added.', 'success'); } catch (err) { toast(err.message, 'error'); }
    renderChips();
  });
  document.getElementById('st-save-hours').addEventListener('click', async () => {
    const clinicStart = document.getElementById('st-open').value, clinicEnd = document.getElementById('st-close').value;
    const slotMinutes = {};
    REGISTER_KEYS.forEach(k => { slotMinutes[k] = toNum(document.getElementById('st-slot-' + k).value) || DEFAULT_SETTINGS.slotMinutes[k]; });
    const btn = document.getElementById('st-save-hours');
    setBtnLoading(btn, true, 'Saving…');
    try {
      await updateDoc(doc(db, 'clinics', state.clinicId), { 'settings.clinicStart': clinicStart, 'settings.clinicEnd': clinicEnd, 'settings.slotMinutes': slotMinutes });
      state.settings.clinicStart = clinicStart; state.settings.clinicEnd = clinicEnd; state.settings.slotMinutes = slotMinutes;
      toast('Clinic hours updated.', 'success');
    } catch (err) { toast(err.message, 'error'); } finally { setBtnLoading(btn, false); }
  });
  document.getElementById('st-change-pw').addEventListener('click', async () => {
    const curPw = document.getElementById('st-cur-pw').value, newPw = document.getElementById('st-new-pw').value;
    if (!curPw || !newPw) { toast('Fill in both fields.', 'error'); return; }
    if (newPw.length < 6) { toast('New password must be at least 6 characters.', 'error'); return; }
    const btn = document.getElementById('st-change-pw');
    setBtnLoading(btn, true, 'Updating…');
    try { await changeOwnPassword(curPw, newPw); toast('Password updated.', 'success'); document.getElementById('st-cur-pw').value = ''; document.getElementById('st-new-pw').value = ''; }
    catch (err) { toast(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? 'Current password is incorrect.' : (err.message || 'Failed.'), 'error'); }
    finally { setBtnLoading(btn, false); }
  });
}
function openMyAccountModal() {
  openModal(`
    <div class="modal-head"><h3>My Account</h3><button class="icon-btn" id="m-x">${icon('x')}</button></div>
    <div class="modal-body">
      <div style="margin-bottom:18px;"><div style="font-size:12.5px;color:var(--slate-500);">Signed in as</div><div style="font-weight:600;font-size:14.5px;">${escapeHtml(state.user.name)}</div><div class="u-muted" style="font-size:12.5px;">${escapeHtml(state.user.email)}</div></div>
      <div class="field-wrap" style="margin-bottom:12px;"><label>Current Password</label><input type="password" id="ma-cur-pw"></div>
      <div class="field-wrap"><label>New Password</label><input type="password" id="ma-new-pw"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="m-cancel">Close</button><button class="btn btn-primary" id="ma-save">${icon('lock')}Update Password</button></div>
  `);
  document.getElementById('m-x').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('ma-save').addEventListener('click', async () => {
    const curPw = document.getElementById('ma-cur-pw').value, newPw = document.getElementById('ma-new-pw').value;
    if (!curPw || !newPw) { toast('Fill in both fields.', 'error'); return; }
    if (newPw.length < 6) { toast('New password must be at least 6 characters.', 'error'); return; }
    const btn = document.getElementById('ma-save');
    setBtnLoading(btn, true, 'Updating…');
    try { await changeOwnPassword(curPw, newPw); toast('Password updated.', 'success'); closeModal(); }
    catch (err) { setBtnLoading(btn, false); toast(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? 'Current password is incorrect.' : (err.message || 'Failed.'), 'error'); }
  });
}

/* ============================================================
   INIT
   ============================================================ */
function wireUserChipClick() {
  const chip = document.querySelector('.user-chip');
  if (chip) { chip.style.cursor = 'pointer'; chip.title = 'My Account · change password'; chip.addEventListener('click', openMyAccountModal); }
}
(function init() {
  if (CONFIG_IS_PLACEHOLDER) { showConfigNeeded(); return; }
  if (INIT_ERROR) { showInitError(INIT_ERROR); return; }
  wireAuthListeners();
  wireUserChipClick();
  setTimeout(showLoadingTimeoutHelp, 8000);
  loadScriptOnce(CHARTJS_CDN).catch(() => {});
  loadScriptOnce(XLSX_CDN).catch(() => {});
})();

</script>
